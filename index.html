
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS GAMING MOD</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #07111f;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    width: 100%;
    padding: 18px 10px;
    text-align: center;
    background: #0c1b30;
    border-bottom: 2px solid #ff304f;
}

header h1 {
    color: #ff304f;
    font-size: 28px;
    font-weight: 900;
}

.panel {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    min-height: 75vh;
    padding: 28px 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 24px;
}

.mod-title {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 900;
    color: #ffffff;
    line-height: 1.25;
    overflow-wrap: anywhere;
    text-transform: uppercase;
}

.video-container {
    width: 100%;
    max-width: 720px;
    aspect-ratio: 16 / 9;
    background: #000000;
    border-radius: 12px;
    overflow: hidden;
}

.video-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

.download-btn {
    display: inline-block;
    padding: 17px 35px;
    background: #21db8b;
    color: #06130d;
    font-size: 21px;
    font-weight: 900;
    text-decoration: none;
    text-align: center;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(33, 219, 139, 0.25);
}

.download-btn:active {
    transform: scale(0.97);
}

@media (max-width: 480px) {
    header h1 {
        font-size: 23px;
    }

    .panel {
        padding: 24px 12px;
        gap: 22px;
    }

    .download-btn {
        width: 100%;
        max-width: 330px;
        font-size: 19px;
        padding: 16px 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>RS GAMING MOD</h1>
</header>

<main class="panel">

    <h2 class="mod-title" id="modTitle">DOWNLOAD MOD</h2>

    <div class="video-container">
        <iframe
            id="modVideo"
            src="https://www.youtube.com/embed/ERKcdOQJpvs"
            title="Mod Video"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <a
        id="downloadButton"
        class="download-btn"
        href="https://sharemods.com/t6e8nqa5adrq/Ksrtc_Bussin_1_Livery.png.html"
        target="_blank"
        rel="noopener noreferrer">
        DOWNLOAD MOD
    </a>

</main>

<script>
/*
  UPDATE THESE THREE VALUES WHEN YOU UPLOAD A NEW MOD.
  No extra photos, videos, or text are displayed.
*/

const MOD_TITLE = "BUSSIN 1 LIVERY";

const VIDEO_URL = "https://youtu.be/ERKcdOQJpvs";

const DOWNLOAD_URL =
"https://sharemods.com/t6e8nqa5adrq/Ksrtc_Bussin_1_Livery.png.html";


function getYouTubeEmbedUrl(url) {
    try {
        const parsed = new URL(url);
        let videoId = "";

        if (parsed.hostname.includes("youtu.be")) {
            videoId = parsed.pathname.split("/").filter(Boolean)[0] || "";
        } else if (
            parsed.hostname.includes("youtube.com") ||
            parsed.hostname.includes("youtube-nocookie.com")
        ) {
            if (parsed.pathname === "/watch") {
                videoId = parsed.searchParams.get("v") || "";
            } else {
                const parts = parsed.pathname.split("/").filter(Boolean);
                const index = parts.findIndex(part =>
                    ["embed", "shorts", "live"].includes(part)
                );

                if (index !== -1) {
                    videoId = parts[index + 1] || "";
                }
            }
        }

        if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
            return "";
        }

        return "https://www.youtube.com/embed/" + videoId;
    } catch (error) {
        return "";
    }
}


document.getElementById("modTitle").textContent = MOD_TITLE;

const embedUrl = getYouTubeEmbedUrl(VIDEO_URL);

if (embedUrl) {
    document.getElementById("modVideo").src = embedUrl;
} else {
    document.getElementById("modVideo").style.display = "none";
}

const downloadButton = document.getElementById("downloadButton");

if (/^https:\/\/sharemods\.com\//i.test(DOWNLOAD_URL)) {
    downloadButton.href = DOWNLOAD_URL;
} else {
    downloadButton.removeAttribute("href");
    downloadButton.removeAttribute("target");
    downloadButton.style.opacity = "0.5";
}
</script>

</body>
</html>
