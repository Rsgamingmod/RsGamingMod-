
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>RS GAMING MOD</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --background: #07111f;
    --panel: #101e33;
    --red: #ff304f;
    --green: #21db8b;
    --white: #ffffff;
}

body {
    background: var(--background);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

header {
    padding: 26px 12px;
    text-align: center;
    background: var(--panel);
    border-bottom: 2px solid var(--red);
}

header h1 {
    color: var(--red);
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1px;
}

header p {
    margin-top: 10px;
    color: var(--green);
    font-size: 13px;
    font-weight: bold;
}

nav {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px 10px;
    background: #0b1728;
}

nav a {
    display: inline-block;
    padding: 10px 16px;
    color: var(--white);
    background: #172940;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    border-radius: 7px;
}

nav a:hover {
    background: var(--red);
}

main {
    width: 100%;
    max-width: 950px;
    min-height: 45vh;
    margin: 0 auto;
    padding: 24px 15px;
}

#modPage {
    width: 100%;
    text-align: center;
}

#modTitle {
    color: var(--green);
    font-size: 32px;
    font-weight: 900;
    line-height: 1.4;
    text-align: center;
    overflow-wrap: anywhere;
    margin: 10px auto 24px;
}

.video-container {
    width: 100%;
    max-width: 760px;
    aspect-ratio: 16 / 9;
    margin: 0 auto 24px;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
}

.video-container iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

#downloadButton {
    display: block;
    width: 100%;
    max-width: 340px;
    margin: 20px auto 0;
    padding: 18px 12px;
    background: var(--green);
    color: #07111f;
    text-decoration: none;
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
}

#downloadButton:hover {
    background: var(--white);
    transform: translateY(-1px);
}

#modPage[hidden] {
    display: none !important;
}

footer {
    margin-top: 25px;
    padding: 24px 12px;
    text-align: center;
    background: var(--panel);
    color: #b7c5d8;
    line-height: 1.8;
}

footer strong {
    color: var(--red);
    font-size: 18px;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 27px;
    }

    header p {
        font-size: 11px;
    }

    main {
        padding: 20px 12px;
    }

    #modTitle {
        font-size: 25px;
    }

    #downloadButton {
        max-width: 320px;
        font-size: 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>RS GAMING MOD</h1>
    <p>BUSSID / BUSSIN MODS — EASY &amp; FAST DOWNLOAD</p>
</header>

<nav>
    <a href="./">HOME</a>
    <a href="./#mods">BUSSID MODS</a>
    <a href="#copyright">COPYRIGHT</a>
</nav>

<main id="mods">
    <section id="modPage" hidden>
        <h2 id="modTitle"></h2>

        <div class="video-container">
            <iframe
                id="modVideo"
                title="Mod video"
                allowfullscreen
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
            </iframe>
        </div>

        <a
            id="downloadButton"
            href="#"
            target="_blank"
            rel="noopener noreferrer">
            DOWNLOAD MOD
        </a>
    </section>
</main>

<footer id="copyright">
    <strong>RS GAMING MOD</strong>
    <p>BUSSID / BUSSIN MODS</p>
    <p>© 2026 RS GAMING MOD</p>
</footer>

<script>
/*
========================================
RS GAMING MOD - MOD SETTINGS
========================================

Every mod needs:
1. id
2. title
3. video
4. download

You can add or update links below.
No default mod cards or placeholder
messages will be displayed.
*/

const mods = [
    /*
    Add your mod like this:

    {
        id: "steering-v452",
        title: "BUSSID V4.5.2 STEERING WHEEL MOD",
        video: "YOUR_YOUTUBE_VIDEO_ID",
        download: "YOUR_SHAREMODS_LINK"
    },

    Add a comma between multiple mod objects.
    */
];

function getModId() {
    const url = new URL(window.location.href);
    return url.searchParams.get("mod");
}

function isValidYouTubeId(id) {
    return typeof id === "string" &&
           /^[a-zA-Z0-9_-]{11}$/.test(id);
}

function showMod() {
    const page = document.getElementById("modPage");
    const title = document.getElementById("modTitle");
    const video = document.getElementById("modVideo");
    const button = document.getElementById("downloadButton");

    const modId = getModId();

    const mod = mods.find(item => item.id === modId);

    if (!mod) {
        page.hidden = true;
        video.removeAttribute("src");
        button.removeAttribute("href");
        title.textContent = "";
        return;
    }

    const modTitle = String(mod.title || "").trim();
    const videoId = String(mod.video || "").trim();
    const downloadLink = String(mod.download || "").trim();

    if (
        !modTitle ||
        !isValidYouTubeId(videoId) ||
        !/^https?:\/\//i.test(downloadLink)
    ) {
        page.hidden = true;
        return;
    }

    title.textContent = modTitle;

    video.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(videoId);

    button.href = downloadLink;

    page.hidden = false;
}

showMod();
</script>

</body>
</html>
