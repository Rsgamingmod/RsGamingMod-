
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101116">
<title>RS GAMING MOD | Livery Downloads</title>

<style>
:root {
  --bg: #101116;
  --card: #1b1c24;
  --yellow: #ffd43b;
  --red: #ff365d;
  --text: #ffffff;
  --muted: #b8bac7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 14px 18px;
  background: #15161d;
  border-bottom: 2px solid var(--yellow);
}

.logo {
  margin: 0;
  color: var(--yellow);
  font-size: clamp(27px, 6vw, 42px);
  font-weight: 900;
  letter-spacing: 1px;
}

.tagline {
  margin: 9px 0 0;
  font-size: 12px;
  color: #e1e1e1;
}

.search-wrap {
  max-width: 650px;
  margin: 20px auto;
  padding: 0 14px;
}

#search {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #41424d;
  border-radius: 12px;
  outline: none;
  background: #20212a;
  color: white;
  font-size: 16px;
}

#search:focus { border-color: var(--yellow); }

nav {
  display: flex;
  gap: 9px;
  padding: 0 14px 15px;
  justify-content: center;
  flex-wrap: wrap;
}

.nav-btn {
  background: #242530;
  color: white;
  border: 1px solid #444550;
  border-radius: 20px;
  padding: 10px 13px;
  cursor: pointer;
  font-size: 12px;
}

.nav-btn.active {
  background: var(--yellow);
  color: #111;
  border-color: var(--yellow);
  font-weight: bold;
}

main {
  width: min(1100px, 100%);
  margin: auto;
  padding: 10px 14px 35px;
}

.category-title {
  text-align: center;
  font-size: clamp(21px, 5vw, 32px);
  color: var(--yellow);
  margin: 20px 0;
  overflow-wrap: anywhere;
}

.featured {
  background: var(--card);
  padding: 12px;
  border-radius: 14px;
  margin-bottom: 28px;
}

.featured-label {
  text-align: center;
  color: var(--red);
  font-size: 13px;
  font-weight: bold;
  margin: 3px 0 12px;
}

.video-frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 9px;
  display: block;
  background: #080808;
}

.featured-caption {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin: 10px 0 2px;
}

.livery-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.livery-card {
  min-width: 0;
  background: var(--card);
  padding: 9px;
  border: 1px solid #2c2d38;
  border-radius: 12px;
}

.livery-image {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
  border-radius: 8px;
  background: #292a32;
  cursor: pointer;
}

.livery-name {
  margin: 10px 0 7px;
  font-size: 14px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.watch-link {
  display: block;
  text-align: center;
  color: var(--yellow);
  text-decoration: none;
  font-size: 11px;
  margin: 8px 0 12px;
}

.download-btn {
  display: block;
  width: 100%;
  text-align: center;
  background: linear-gradient(100deg, #ffd43b, #ff9d24);
  color: #111;
  padding: 12px 6px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 900;
  text-decoration: none;
  border: 0;
  cursor: pointer;
}

.download-caption {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  margin: 8px 0 3px;
}

.back-btn {
  display: inline-block;
  padding: 10px 15px;
  background: #292a35;
  color: white;
  border: 1px solid #4a4b57;
  border-radius: 8px;
  margin: 5px 0 18px;
  cursor: pointer;
}

.detail {
  max-width: 760px;
  margin: auto;
  background: var(--card);
  padding: 13px;
  border-radius: 14px;
}

.detail .livery-name {
  font-size: 23px;
  color: var(--yellow);
  text-align: center;
}

.detail .watch-link {
  margin: 12px 0 20px;
  font-size: 12px;
}

.detail .download-btn {
  padding: 16px;
  font-size: 16px;
}

.detail .download-caption {
  margin-top: 10px;
  font-size: 11px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 30px 8px;
}

footer {
  text-align: center;
  color: #9c9eaa;
  font-size: 11px;
  padding: 25px 12px;
  border-top: 1px solid #292a32;
}

[hidden] { display: none !important; }

@media (min-width: 700px) {
  .livery-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  main { padding-left: 22px; padding-right: 22px; }
}

@media (min-width: 1000px) {
  .livery-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
</style>
</head>

<body>
<header>
  <h1 class="logo">RS GAMING MOD</h1>
  <p class="tagline">
    All Liveries in One App — Easy &amp; Fast Downloads
  </p>
</header>

<div class="search-wrap">
  <input id="search" type="search"
    placeholder="🔎 Search liveries..."
    aria-label="Search liveries">
</div>

<nav id="categories" aria-label="Livery categories"></nav>

<main>
  <section id="home-view">
    <h2 id="category-title" class="category-title"></h2>

    <section class="featured">
      <p class="featured-label">LATEST LIVERY RELEASE VIDEO</p>
      <div id="featured-video"></div>
      <p class="featured-caption">
        Watch the latest livery release on our YouTube channel.
      </p>
    </section>

    <div id="livery-grid" class="livery-grid"></div>
    <p id="empty-message" class="empty" hidden>
      No liveries found. Try another search.
    </p>
  </section>

  <section id="detail-view" hidden>
    <button id="back-btn" class="back-btn">← Back to Liveries</button>
    <div id="detail-content"></div>
  </section>
</main>

<footer>
  RS GAMING MOD · BUSSID LIVERIES · Easy &amp; Fast Downloads
</footer>

<script>
/*
  EDIT YOUR LIVERIES HERE.

  youtubeId: YouTube video ID only.
  image: direct image URL.
  download: that livery's ShareMods URL.
  name: actual livery name.
  keywords: words users can search.
*/

const categories = [
  {
    id: "nwkrtc-green",
    name: "NWKRTC GREEN LIVERIES",
    featuredVideo: "YOUR_GREEN_CATEGORY_VIDEO_ID"
  },
  {
    id: "ksrtc",
    name: "KSRTC LIVERIES",
    featuredVideo: "YOUR_KSRTC_CATEGORY_VIDEO_ID"
  },
  {
    id: "kkrtc",
    name: "KKRTC LIVERIES",
    featuredVideo: "YOUR_KKRTC_CATEGORY_VIDEO_ID"
  },
  {
    id: "nwkrtc-red-silver",
    name: "NWKRTC RED & SILVER LIVERIES",
    featuredVideo: "YOUR_RED_SILVER_CATEGORY_VIDEO_ID"
  },
  {
    id: "others",
    name: "OTHER LIVERIES",
    featuredVideo: "YOUR_OTHER_CATEGORY_VIDEO_ID"
  }
];

const liveries = [
  {
    id: "green-1",
    category: "nwkrtc-green",
    name: "ADD NWKRTC GREEN LIVERY NAME",
    image: "https://placehold.co/640x480/20212a/ffd43b?text=NWKRTC+GREEN",
    youtubeId: "YOUR_LIVERY_VIDEO_ID",
    download: "https://sharemods.com/YOUR_SHAREMODS_LINK.html",
    keywords: "nwkrtc green bus Karnataka"
  },
  {
    id: "ksrtc-1",
    category: "ksrtc",
    name: "ADD KSRTC LIVERY NAME",
    image: "https://placehold.co/640x480/20212a/ffd43b?text=KSRTC",
    youtubeId: "YOUR_LIVERY_VIDEO_ID",
    download: "https://sharemods.com/YOUR_SHAREMODS_LINK.html",
    keywords: "ksrtc Karnataka bus"
  },
  {
    id: "kkrtc-1",
    category: "kkrtc",
    name: "ADD KKRTC LIVERY NAME",
    image: "https://placehold.co/640x480/20212a/ffd43b?text=KKRTC",
    youtubeId: "YOUR_LIVERY_VIDEO_ID",
    download: "https://sharemods.com/YOUR_SHAREMODS_LINK.html",
    keywords: "kkrtc bus livery"
  },
  {
    id: "red-silver-1",
    category: "nwkrtc-red-silver",
    name: "ADD NWKRTC RED & SILVER LIVERY NAME",
    image: "https://placehold.co/640x480/20212a/ffd43b?text=RED+%26+SILVER",
    youtubeId: "YOUR_LIVERY_VIDEO_ID",
    download: "https://sharemods.com/YOUR_SHAREMODS_LINK.html",
    keywords: "nwkrtc red silver bus"
  },
  {
    id: "other-1",
    category: "others",
    name: "ADD OTHER LIVERY NAME",
    image: "https://placehold.co/640x480/20212a/ffd43b?text=OTHER+LIVERY",
    youtubeId: "YOUR_LIVERY_VIDEO_ID",
    download: "https://sharemods.com/YOUR_SHAREMODS_LINK.html",
    keywords: "other livery bus mod"
  }
];

const nav = document.getElementById("categories");
const search = document.getElementById("search");
const homeView = document.getElementById("home-view");
const detailView = document.getElementById("detail-view");
const title = document.getElementById("category-title");
const featured = document.getElementById("featured-video");
const grid = document.getElementById("livery-grid");
const emptyMessage = document.getElementById("empty-message");
const detailContent = document.getElementById("detail-content");

let currentCategory = categories[0].id;
let currentLivery = null;

function safeYouTubeId(id) {
  return /^[a-zA-Z0-9_-]{11}$/.test(id || "");
}

function videoUrl(id) {
  return "https://www.youtube.com/watch?v=" + encodeURIComponent(id);
}

function makeVideo(id) {
  if (!safeYouTubeId(id)) {
    const message = document.createElement("div");
    message.className = "empty";
    message.textContent = "Add the correct YouTube video ID in the code.";
    return message;
  }

  const frame = document.createElement("iframe");
  frame.className = "video-frame";
  frame.src = "https://www.youtube-nocookie.com/embed/" +
    encodeURIComponent(id);
  frame.title = "Livery release video";
  frame.loading = "lazy";
  frame.allow =
    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  frame.allowFullscreen = true;
  return frame;
}

function makeWatchLink(id) {
  const link = document.createElement("a");
  link.className = "watch-link";
  link.textContent = "Watch Full Video";
  link.href = safeYouTubeId(id) ? videoUrl(id) : "#";
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  if (!safeYouTubeId(id)) {
    link.addEventListener("click", event => {
      event.preventDefault();
      alert("Please add this livery's YouTube video ID first.");
    });
  }

  return link;
}

function validShareModsLink(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === "https:" &&
      parsed.hostname === "sharemods.com" &&
      !url.includes("YOUR_SHAREMODS_LINK");
  } catch {
    return false;
  }
}

function makeDownloadArea(item) {
  const wrap = document.createElement("div");
  const button = document.createElement("a");
  button.className = "download-btn";
  button.textContent = "DOWNLOAD";

  if (validShareModsLink(item.download)) {
    button.href = item.download;
    button.target = "_blank";
    button.rel = "noopener noreferrer";
  } else {
    button.href = "#";
    button.addEventListener("click", event => {
      event.preventDefault();
      alert("Add the correct ShareMods download link for this livery.");
    });
  }

  const caption = document.createElement("p");
  caption.className = "download-caption";
  caption.textContent = "Click To Download";

  wrap.append(button, caption);
  return wrap;
}

function renderNav() {
  nav.replaceChildren();

  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "nav-btn" +
      (category.id === currentCategory ? " active" : "");
    button.textContent = category.name;

    button.addEventListener("click", () => {
      currentCategory = category.id;
      search.value = "";
      showHome();
    });

    nav.appendChild(button);
  });
}

function renderHome() {
  const category = categories.find(c => c.id === currentCategory);
  title.textContent = category.name;

  featured.replaceChildren(makeVideo(category.featuredVideo));
  grid.replaceChildren();

  const query = search.value.trim().toLowerCase();

  const results = liveries.filter(item => {
    const matchesCategory = item.category === currentCategory;
    const searchable = (
      item.name + " " + item.keywords + " " + item.category
    ).toLowerCase();

    return matchesCategory && searchable.includes(query);
  });

  results.forEach(item => {
    const card = document.createElement("article");
    card.className = "livery-card";

    const image = document.createElement("img");
    image.className = "livery-image";
    image.src = item.image;
    image.alt = item.name;
    image.loading = "lazy";
    image.addEventListener("click", () => showDetail(item.id));

    const name = document.createElement("h3");
    name.className = "livery-name";
    name.textContent = item.name;

    card.append(image, name);
    grid.appendChild(card);
  });

  emptyMessage.hidden = results.length > 0;
  renderNav();
}

function showHome() {
  currentLivery = null;
  homeView.hidden = false;
  detailView.hidden = true;
  renderHome();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showDetail(id) {
  const item = liveries.find(livery => livery.id === id);
  if (!item) return;

  currentLivery = item;
  homeView.hidden = true;
  detailView.hidden = false;
  detailContent.replaceChildren();

  const detail = document.createElement("article");
  detail.className = "detail";

  const video = makeVideo(item.youtubeId);

  const name = document.createElement("h2");
  name.className = "livery-name";
  name.textContent = item.name;

  detail.append(video, name, makeWatchLink(item.youtubeId),
    makeDownloadArea(item));

  detailContent.appendChild(detail);

  history.replaceState(
    { liveryId: item.id },
    "",
    "?livery=" + encodeURIComponent(item.id)
  );

  window.scrollTo({ top: 0, behavior: "smooth" });
}

search.addEventListener("input", () => {
  homeView.hidden = false;
  detailView.hidden = true;

  const query = search.value.trim().toLowerCase();

  if (query) {
    const matching = liveries.find(item =>
      (item.name + " " + item.keywords).toLowerCase().includes(query)
    );

    if (matching) currentCategory = matching.category;
  }

  renderHome();
});

document.getElementById("back-btn").addEventListener("click", () => {
  history.replaceState({}, "", window.location.pathname);
  showHome();
});

function init() {
  const params = new URLSearchParams(window.location.search);
  const liveryId = params.get("livery");

  if (liveryId && liveries.some(item => item.id === liveryId)) {
    const item = liveries.find(item => item.id === liveryId);
    currentCategory = item.category;
    renderNav();
    showDetail(liveryId);
  } else {
    showHome();
  }
}

init();
</script>
</body>
</html>
