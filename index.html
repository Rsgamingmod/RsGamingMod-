
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>RS Gaming Mod</title>
<style>
:root {
  --bg:#080b16; --card:#131a2b; --accent:#00e5ff;
  --text:#f5f7ff; --muted:#aab5ca;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
header {
  text-align:center; padding:27px 12px 20px;
  background:linear-gradient(180deg,#171c35,#080b16);
}
.brand {
  margin:0; font-size:clamp(30px,7vw,48px);
  font-weight:900; animation:rainbow 8s linear infinite;
  background:linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet,red);
  background-size:300% auto;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
}
@keyframes rainbow {
  to { background-position:300% center; }
}
.tagline { color:#d5dced; margin:12px 0 0; }
main { max-width:1050px; margin:auto; padding:18px 14px 45px; }
.search {
  width:100%; padding:15px; border-radius:13px;
  border:1px solid #343d55; background:#111728;
  color:white; font-size:16px; outline:none; margin-bottom:20px;
}
.search:focus { border-color:var(--accent); }
.games {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.game {
  min-width:0; background:var(--card); border:1px solid #28344d;
  border-radius:17px; padding:14px; text-align:center;
}
.profile {
  width:100%; max-width:150px; aspect-ratio:1; object-fit:cover;
  border-radius:50%; border:3px solid var(--accent);
  background:#202940;
}
.game h2 { font-size:22px; margin:12px 0 6px; }
.game p { color:var(--muted); font-size:13px; margin:0 0 12px; }
.section-title { margin:26px 0 13px; font-size:21px; }
.categories { display:grid; grid-template-columns:1fr; gap:12px; }
.category {
  position:relative; overflow:hidden; text-align:left; cursor:pointer;
  color:white; width:100%; padding:20px 16px;
  border:1px solid #35405c; border-radius:14px;
  background:linear-gradient(120deg,#18233b,#26183b,#142b38);
  font-size:16px; font-weight:800;
}
.category::before {
  content:""; position:absolute; inset:0 auto 0 0; width:4px;
  background:linear-gradient(#00e5ff,#b94dff,#ffcb45);
}
.category span { display:block; font-size:12px; color:#bac8df; margin-top:7px; }
.category:hover { border-color:var(--accent); transform:translateY(-1px); }
button { font:inherit; }
.panel {
  background:var(--card); border:1px solid #28344d;
  border-radius:16px; padding:20px; margin-top:16px;
}
.back {
  background:#202940; color:white; border:1px solid #3a4762;
  padding:10px 15px; border-radius:9px; cursor:pointer;
}
.version {
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; width:100%; text-align:left; color:white;
  background:#192239; border:1px solid #34435f; border-radius:12px;
  padding:16px; margin-top:11px; cursor:pointer;
}
.version strong { font-size:17px; }
.version small { color:#b7c5db; }
.arrow { color:var(--accent); font-size:22px; }
.mod-title { text-align:center; font-size:clamp(26px,6vw,40px); overflow-wrap:anywhere; }
.video-wrap {
  position:relative; width:100%; aspect-ratio:16/9; margin:16px 0;
  background:#000; border-radius:12px; overflow:hidden;
}
.video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.download {
  display:block; width:min(100%,360px); margin:22px auto 0;
  text-align:center; padding:17px 12px; color:#001017;
  background:linear-gradient(90deg,#00e5ff,#45ffb0);
  border-radius:12px; text-decoration:none; font-size:20px;
  font-weight:900; box-shadow:0 0 22px #00e5ff30;
}
.download-note { text-align:center; color:#b6c2d8; font-size:12px; margin-top:8px; }
.empty { color:var(--muted); padding:20px 0; text-align:center; }
footer { color:#8492ad; text-align:center; padding:20px; font-size:12px; }
@media(min-width:650px) {
  .categories { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .game { padding:20px; }
}
</style>
</head>
<body>
<header>
  <h1 class="brand">RS Gaming Mod</h1>
  <p class="tagline">Bussid &amp; Bussin Mods Easy And Fast Download</p>
</header>

<main>
  <input id="search" class="search" type="search"
    placeholder="Search mods, categories or versions..."
    aria-label="Search mods">

  <section id="home">
    <div class="games">
      <div class="game">
        <img class="profile"
          src="https://raw.githubusercontent.com/Rsgamingmod/RsGamingMod-/main/unnamed%20(2).png"
          alt="BUSSID profile"
          onerror="this.style.display='none'">
        <h2>BUSSID</h2>
        <p>BUSSID Mods</p>
        <button class="back" onclick="showGame('bussid')">OPEN BUSSID</button>
      </div>
      <div class="game">
        <img class="profile"
          src="https://raw.githubusercontent.com/Rsgamingmod/RsGamingMod-/main/unnamed%20(1).png"
          alt="BUSSIN profile"
          onerror="this.style.display='none'">
        <h2>BUSSIN</h2>
        <p>BUSSIN Mods</p>
        <button class="back" onclick="showGame('bussin')">OPEN BUSSIN</button>
      </div>
    </div>
    <h2 class="section-title">Categories</h2>
    <div id="homeCategories" class="categories"></div>
  </section>

  <section id="results" hidden>
    <button class="back" onclick="goHome()">← HOME</button>
    <div id="resultContent"></div>
  </section>
</main>

<footer>RS Gaming Mod</footer>

<script>
/*
  ADD NEW MODS inside the mods array.
  Each mod needs a unique id, game, category, version, name,
  YouTube video ID and download URL.
*/
const categories = [
  "REALISTIC RAIN 🌧️⛈️ MOD",
  "STEERING WHEEL MOD",
  "WHEEL CAP MOD",
  "GARAGE MOD"
];

const mods = [
  {
    id: "steering-wheel-v4-6",
    game: "bussid",
    category: "STEERING WHEEL MOD",
    version: "v4.6",
    name: "ASHOK LEYLAND STEERING WHEEL PACK",
    video: "eZfmXlZqSEU",
    download: "https://sharemods.com/8yf6gh81ry69/ASHOK_LEYLAND_STEERING_WHEEL_PACK.7z.html"
  },
  {
    id: "steering-wheel-v4-5-2",
    game: "bussid",
    category: "STEERING WHEEL MOD",
    version: "v4.5.2",
    name: "STEERING WHEEL MOD",
    video: "eZfmXlZqSEU",
    download: "https://sharemods.com/8yf6gh81ry69/ASHOK_LEYLAND_STEERING_WHEEL_PACK.7z.html"
  }
];

// URL format: #/mod/steering-wheel-v4-6
// IDs are stored in the URL, never printed as public page text.
const $ = id => document.getElementById(id);
let currentGame = "bussid";

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function categorySlug(category) {
  return category.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g,"");
}

function goHome() {
  location.hash = "/";
}

function showGame(game) {
  currentGame = game;
  location.hash = "/game/" + game;
}

function openCategory(game, category) {
  location.hash = "/category/" + game + "/" + categorySlug(category);
}

function openMod(id) {
  location.hash = "/mod/" + encodeURIComponent(id);
}

function categoryMarkup(game, query = "") {
  return categories.filter(category =>
    (game + " " + category).toLowerCase().includes(query.toLowerCase())
  ).map(category => `
    <button class="category" data-category="${esc(category)}"
      data-game="${game}">
      ${esc(category)}
      <span>View available versions →</span>
    </button>
  `).join("");
}

function bindCategories() {
  document.querySelectorAll("[data-category]").forEach(button => {
    button.onclick = () => openCategory(button.dataset.game, button.dataset.category);
  });
}

function renderHome() {
  $("home").hidden = false;
  $("results").hidden = true;
  $("homeCategories").innerHTML =
    categoryMarkup("bussid") + categoryMarkup("bussin");
  bindCategories();
}

function renderGame(game) {
  $("home").hidden = true;
  $("results").hidden = false;
  $("resultContent").innerHTML = `
    <h2 class="section-title">${game.toUpperCase()}</h2>
    <div class="categories">${categoryMarkup(game)}</div>`;
  bindCategories();
}

function renderCategory(game, slug) {
  const category = categories.find(c => categorySlug(c) === slug);
  if (!category) return renderNotFound();

  const list = mods.filter(m => m.game === game && m.category === category);
  const versions = [...new Set(list.map(m => m.version))];

  $("home").hidden = true;
  $("results").hidden = false;
  $("resultContent").innerHTML = `
    <h2 class="section-title">${game.toUpperCase()}</h2>
    <div class="panel">
      <h2>${esc(category)}</h2>
      <p>Available versions</p>
      ${versions.length ? versions.map(version => `
        <button class="version" data-version="${esc(version)}">
          <strong>${esc(version)}</strong><span class="arrow">›</span>
        </button>`).join("") :
        '<p class="empty">No versions uploaded yet.</p>'}
    </div>`;

  document.querySelectorAll("[data-version]").forEach(button => {
    button.onclick = () => {
      const version = button.dataset.version;
      const mod = list.find(m => m.version === version);
      if (mod) openMod(mod.id);
      else {
        $("resultContent").insertAdjacentHTML("beforeend",
          '<p class="empty">No mod details available for this version.</p>');
      }
    };
  });
}

function renderMod(id) {
  const mod = mods.find(m => m.id === id);
  if (!mod) return renderNotFound();

  $("home").hidden = true;
  $("results").hidden = false;
  $("resultContent").innerHTML = `
    <div class="panel">
      <h1 class="mod-title">${esc(mod.name)}</h1>
      <p style="text-align:center;color:#aab5ca">
        ${mod.game.toUpperCase()} · ${esc(mod.category)} · ${esc(mod.version)}
      </p>
      <h2 style="text-align:center">VIDEO</h2>
      <div class="video-wrap">
        <iframe
          src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(mod.video)}"
          title="Mod video"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>
      <a class="download" href="${esc(mod.download)}"
        target="_blank" rel="noopener noreferrer">DOWNLOAD</a>
      <p class="download-note">Click On Download</p>
    </div>`;
}

function renderNotFound() {
  $("home").hidden = true;
  $("results").hidden = false;
  $("resultContent").innerHTML = `
    <div class="panel">
      <h2>Page not found</h2>
      <p>Please choose a category or version from the home page.</p>
      <button class="back" onclick="goHome()">← HOME</button>
    </div>`;
}

function route() {
  const parts = decodeURIComponent(location.hash.slice(1)).split("/").filter(Boolean);
  if (!parts.length) return renderHome();
  if (parts[0] === "game" && ["bussid","bussin"].includes(parts[1])) {
    return renderGame(parts[1]);
  }
  if (parts[0] === "category" &&
      ["bussid","bussin"].includes(parts[1]) && parts[2]) {
    return renderCategory(parts[1], parts[2]);
  }
  if (parts[0] === "mod" && parts[1]) return renderMod(parts[1]);
  renderNotFound();
}

$("search").addEventListener("input", event => {
  const query = event.target.value.trim().toLowerCase();
  if (!query) {
    if (!location.hash || location.hash === "#/") renderHome();
    return;
  }
  $("home").hidden = true;
  $("results").hidden = false;
  const matches = mods.filter(m =>
    [m.name,m.game,m.category,m.version].join(" ").toLowerCase().includes(query)
  );
  $("resultContent").innerHTML = `
    <h2 class="section-title">Search Results</h2>
    ${matches.length ? matches.map(m => `
      <button class="version" data-mod="${esc(m.id)}">
        <strong>${esc(m.name)}</strong>
        <small>${m.game.toUpperCase()} · ${esc(m.version)}</small>
      </button>`).join("") : '<p class="empty">No mods found.</p>'}`;
  document.querySelectorAll("[data-mod]").forEach(button => {
    button.onclick = () => openMod(button.dataset.mod);
  });
});

window.addEventListener("hashchange", route);
renderHome();
route();
</script>
</body>
</html>
