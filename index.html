
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RS GAMING MOD</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #07111f;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 25px 12px;
    background: #101e33;
    border-bottom: 2px solid #ff304f;
}

header h1 {
    color: #ff304f;
    font-size: 32px;
    font-weight: 900;
}

header p {
    margin-top: 10px;
    color: #21db8b;
    font-size: 13px;
}

nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px;
    background: #0b1728;
}

nav a {
    color: white;
    text-decoration: none;
    background: #172940;
    padding: 10px 16px;
    border-radius: 7px;
    font-weight: bold;
}

nav a:hover {
    background: #ff304f;
}

main {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px 15px;
}

#detailPage {
    text-align: center;
    width: 100%;
}

#modTitle {
    color: #21db8b;
    font-size: 30px;
    font-weight: 900;
    line-height: 1.4;
    text-align: center;
    margin: 15px 0 22px;
}

.video-box {
    width: 100%;
    max-width: 750px;
    aspect-ratio: 16 / 9;
    margin: 0 auto 22px;
    background: #000000;
    border-radius: 10px;
    overflow: hidden;
}

.video-box iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

#downloadButton {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 20px auto 0;
    padding: 17px 12px;
    background: #21db8b;
    color: #07111f;
    text-align: center;
    text-decoration: none;
    font-size: 21px;
    font-weight: 900;
    border-radius: 10px;
}

#downloadButton:hover {
    background: #ffffff;
}

footer {
    margin-top: 30px;
    padding: 22px 12px;
    text-align: center;
    background: #101e33;
    color: #b7c5d8;
    line-height: 1.8;
}

footer strong {
    color: #ff304f;
}

@media (max-width: 480px) {
    header h1 {
        font-size: 27px;
    }

    #modTitle {
        font-size: 24px;
    }

    #downloadButton {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <h1>RS GAMING MOD</h1>
    <p>BUSSID / BUSSIN MODS — EASY & FAST DOWNLOAD</p>
</header>

<nav>
    <a href="./">HOME</a>
    <a href="./#mods">BUSSID MODS</a>
    <a href="./#copyright">COPYRIGHT</a>
</nav>

<main>
    <section id="detailPage" hidden>
        <h2 id="modTitle"></h2>

        <div class="video-box">
            <iframe
                id="modVideo"
                title="Mod Video"
                allowfullscreen
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
            </iframe>
        </div>

        <a id="downloadButton"
           href="#"
           target="_blank"
           rel="noopener noreferrer">
            DOWNLOAD MOD
        </a>
    </section>
</main>

<footer id="copyright">
    <strong>RS GAMING MOD</strong>
    <p>BUSSID / BUSSIN MODS</p>
    <p>© 2026 RS GAMING MOD</p>
</footer>

<script>
/*
==========================================
ADD YOUR MOD DETAILS HERE
==========================================

id       = Unique mod link name
title    = Big text shown on the last page
video    = YouTube video ID
download = Download link

No default mods are displayed.
Add only the mods you want.
*/

const mods = [
    /*
    Example:

    {
        id: "my-mod",
        title: "MY BUSSID MOD",
        video: "YOUR_YOUTUBE_VIDEO_ID",
        download: "YOUR_DOWNLOAD_LINK"
    }
    */
];

function showModPage() {
    const params = new URLSearchParams(window.location.search);
    const modId = params.get("mod");

    const mod = mods.find(item => item.id === modId);

    const detailPage = document.getElementById("detailPage");

    if (!mod || !mod.title || !mod.video || !mod.download) {
        detailPage.hidden = true;
        return;
    }

    document.getElementById("modTitle").textContent = mod.title;

    document.getElementById("modVideo").src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(mod.video);

    document.getElementById("downloadButton").href = mod.download;

    detailPage.hidden = false;
}

showModPage();
</script>

</body>
</html>
