<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<style>
:root {
  --bg: #07111f;
  --card: #101e30;
  --red: #ff304f;
  --green: #21db8b;
  --text: #ffffff;
  --muted: #b8c5d6;
  --border: #26364b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 12px;
  background: linear-gradient(135deg, #101e30, #172b46);
  border-bottom: 2px solid var(--red);
}

.logo {
  margin: 0;
  font-size: clamp(27px, 6vw, 43px);
  font-weight: 900;
  background: linear-gradient(90deg, #ff304f, #ffb52e, #21db8b, #31baff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

header p {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 0;
}

nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 13px;
  background: #0b1727;
  border-bottom: 1px solid var(--border);
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 8px;
  padding: 12px 16px;
  font-weight: bold;
}

.nav-button {
  background: #192a40;
  color: white;
}

.nav-button:hover { background: var(--red); }

main {
  width: min(1100px, 94%);
  min-height: 55vh;
  margin: 24px auto;
}

.hero {
  text-align: center;
  padding: 24px 8px;
}

.hero h2 {
  font-size: clamp(22px, 5vw, 34px);
}

.hero h2 span { color: var(--green); }
.hero p { color: var(--muted); }

.search-wrap {
  max-width: 650px;
  margin: 22px auto;
}

#search {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #344862;
  background: var(--card);
  color: white;
  font-size: 16px;
  outline: none;
}

#search:focus { border-color: var(--green); }

.section-title {
  font-size: 22px;
  border-left: 4px solid var(--red);
  padding-left: 12px;
  margin: 28px 0 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  min-width: 0;
}

.card h3, .card h2 { overflow-wrap: anywhere; }
.card p { color: var(--muted); font-size: 14px; }

.category-card {
  text-align: center;
  padding: 25px 10px;
  cursor: pointer;
  transition: .2s;
}

.category-card:hover {
  border-color: var(--green);
  transform: translateY(-2px);
}

.category-icon { font-size: 35px; }

.primary {
  display: block;
  width: 100%;
  margin-top: 13px;
  background: var(--green);
  color: #061b13;
  font-size: 15px;
}

.back {
  background: #213750;
  color: white;
  margin-bottom: 18px;
}

.video-frame, .video-placeholder {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 9px;
  background: #030914;
}

.video-placeholder {
  display: grid;
  place-items: center;
  color: var(--muted);
  text-align: center;
  padding: 12px;
}

.download-note {
  text-align: center;
  color: var(--green);
  font-size: 13px;
  margin-top: 8px;
}

.empty {
  color: var(--muted);
  text-align: center;
  padding: 30px 8px;
}

.policy {
  line-height: 1.8;
  color: var(--muted);
}

footer {
  text-align: center;
  padding: 24px 12px;
  margin-top: 40px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
}

footer strong { color: var(--red); }

@media (max-width: 520px) {
  main { width: 92%; }
  .grid { gap: 10px; }
  .card { padding: 11px; }
  .card h3 { font-size: 15px; }
  .category-card { padding: 20px 5px; }
}
</style>
</head>

<body>

];

const app = document.getElementById("app");
const searchInput = document.getElementById("search");

let currentPage = "home";
let currentCategory = "";
let currentMod = null;
let currentVersion = null;
let currentSearch = "";

document.getElementById("year").textContent = new Date().getFullYear();

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function validLink(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" || url.protocol === "http:";
  } catch {
    return false;
  }
}

function getYouTubeEmbed(link) {
  if (!link || !validLink(link)) return "";

  try {
    const url = new URL(link);
    let id = "";

    if (url.hostname === "youtu.be") {
      id = url.pathname.slice(1).split("/")[0];
    } else if (
      url.hostname === "youtube.com" ||
      url.hostname.endsWith(".youtube.com")
    ) {
      if (url.pathname === "/watch") {
        id = url.searchParams.get("v") || "";
      } else if (
        url.pathname.startsWith("/embed/") ||
        url.pathname.startsWith("/shorts/")
      ) {
        id = url.pathname.split("/")[2] || "";
      }
    }

    if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return "";
    return "https://www.youtube-nocookie.com/embed/" + id;
  } catch {
    return "";
  }
}

function goHome() {
  currentPage = "home";
  currentCategory = "";
  currentMod = null;
  currentVersion = null;
  currentSearch = "";
  searchInput.value = "";
  renderHome();
  window.scrollTo(0, 0);
}

function showCategories() {
  currentPage = "categories";
  currentCategory = "";
  currentMod = null;
  currentVersion = null;

  app.innerHTML = `
    <h2 class="section-title">CATEGORIES</h2>
    <div class="grid">
      <div class="card category-card"
        onclick="openCategory('BUSSID')">
        <div class="category-icon">🚌</div>
        <h3>BUSSID</h3>
        <p>BUSSID Mods and Versions</p>
        <button class="primary"
          onclick="event.stopPropagation();openCategory('BUSSID')">
          VIEW MODS
        </button>
      </div>

      <div class="card category-card"
        onclick="openCategory('BUSSIN')">
        <div class="category-icon">🚍</div>
        <h3>BUSSIN</h3>
        <p>BUSSIN Mods and Versions</p>
        <button class="primary"
          onclick="event.stopPropagation();openCategory('BUSSIN')">
          VIEW MODS
        </button>
      </div>
    </div>`;
  window.scrollTo(0, 0);
}

function showPolicy() {
  currentPage = "policy";

  app.innerHTML = `
    <button class="back" onclick="goHome()">← HOME</button>
    <div class="card policy">
      <h2>Copyright Policy</h2>
      <p>RS GAMING MOD respects the rights of content creators and copyright owners.</p>
      <p>Videos may be embedded from YouTube. Download buttons may redirect visitors to third-party websites such as ShareMods.</p>
      <p>We do not claim ownership of third-party content. All respective owners retain their rights.</p>
      <p>Only upload or distribute files that you own or have permission to share.</p>
      <p>Copyright concerns can be reported to the website owner with the relevant link and proof of ownership.</p>
    </div>`;
  window.scrollTo(0, 0);
}

function renderHome() {
  currentPage = "home";

  app.innerHTML = `
    <h2 class="section-title">CATEGORIES</h2>
    <div class="grid">
      <div class="card category-card"
        onclick="openCategory('BUSSID')">
        <div class="category-icon">🚌</div>
        <h3>BUSSID</h3>
        <button class="primary"
          onclick="event.stopPropagation();openCategory('BUSSID')">
          VIEW MODS
        </button>
      </div>

      <div class="card category-card"
        onclick="openCategory('BUSSIN')">
        <div class="category-icon">🚍</div>
        <h3>BUSSIN</h3>
        <button class="primary"
          onclick="event.stopPropagation();openCategory('BUSSIN')">
          VIEW MODS
        </button>
      </div>
    </div>

    <h2 class="section-title">ALL MODS</h2>
    <div id="allMods" class="grid"></div>`;

  renderModCards(modsData, document.getElementById("allMods"));
}

function renderModCards(mods, container) {
  if (!container) return;

  const query = currentSearch.trim().toLowerCase();

  const filtered = mods.filter(mod => {
    const versions = mod.versions.map(version =>
      version.version + " " +
      version.liveries.map(item => item.name).join(" ")
    ).join(" ");

    return (mod.name + " " + mod.category + " " + versions)
      .toLowerCase().includes(query);
  });

  if (!filtered.length) {
    container.innerHTML = `<div class="empty">No mods found.</div>`;
    return;
  }

  container.innerHTML = filtered.map(mod => `
    <div class="card">
      <div class="category-icon">${escapeHTML(mod.icon || "🚌")}</div>
      <p>${escapeHTML(mod.category)}</p>
      <h3>${escapeHTML(mod.name)}</h3>
      <p>${mod.versions.length} version(s) available</p>
      <button class="primary"
        onclick="openMod('${escapeHTML(mod.id)}')">
        VIEW VERSIONS
      </button>
    </div>
  `).join("");
}

function openCategory(category) {
  currentPage = "category";
  currentCategory = category;
  currentMod = null;
  currentVersion = null;

  app.innerHTML = `
    <button class="back" onclick="showCategories()">← CATEGORIES</button>
    <h2 class="section-title">${escapeHTML(category)} MODS</h2>
    <div id="categoryMods" class="grid"></div>`;

  renderModCards(
    modsData.filter(mod => mod.category === category),
    document.getElementById("categoryMods")
  );

  window.scrollTo(0, 0);
}

function openMod(modId) {
  const mod = modsData.find(item => item.id === modId);
  if (!mod) return;

  currentPage = "versions";
  currentMod = mod;
  currentVersion = null;

  app.innerHTML = `
    <button class="back"
      onclick="openCategory('${escapeHTML(mod.category)}')">
      ← BACK
    </button>
    <h2 class="section-title">${escapeHTML(mod.name)}</h2>
    <div class="grid">
      ${mod.versions.map((version, index) => `
        <div class="card">
          <h3>${escapeHTML(version.version)}</h3>
          <button class="primary"
            onclick="openVersion('${escapeHTML(mod.id)}', ${index})">
            DOWNLOAD MOD
          </button>
        </div>
      `).join("")}
    </div>`;

  window.scrollTo(0, 0);
}

function openVersion(modId, versionIndex) {
  const mod = modsData.find(item => item.id === modId);
  if (!mod || !mod.versions[versionIndex]) return;

  currentPage = "details";
  currentMod = mod;
  currentVersion = mod.versions[versionIndex];

  app.innerHTML = `
    <button class="back"
      onclick="openMod('${escapeHTML(mod.id)}')">
      ← BACK TO VERSIONS
    </button>
    <h2 class="section-title">
      ${escapeHTML(mod.name)} — ${escapeHTML(currentVersion.version)}
    </h2>
    <div id="liveryList" class="grid"></div>`;

  const list = document.getElementById("liveryList");
  const query = currentSearch.trim().toLowerCase();

  const items = currentVersion.liveries.filter(item =>
    !query ||
    (item.name + " " + mod.name + " " + currentVersion.version)
      .toLowerCase().includes(query)
  );

  if (!items.length) {
    list.innerHTML = `<div class="empty">No matching mods found.</div>`;
    return;
  }

  list.innerHTML = items.map(item => {
    const embed = getYouTubeEmbed(item.video);

    const video = embed
      ? `<iframe class="video-frame"
          src="${escapeHTML(embed)}"
          title="${escapeHTML(item.name)}"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>`
      : `<div class="video-placeholder">YOUTUBE VIDEO LINK NOT ADDED</div>`;

    const download = validLink(item.download)
      ? `<button class="primary"
          onclick="openDownload('${escapeHTML(item.download)}')">
          ⬇ DOWNLOAD
        </button>`
      : `<button class="primary" disabled
          style="opacity:.6;cursor:not-allowed">
          DOWNLOAD LINK NOT ADDED
        </button>`;

    return `
      <article class="card">
        <h2 style="text-align:center">${escapeHTML(item.name)}</h2>
        ${video}
        <p style="text-align:center">WATCH FULL VIDEO</p>
        ${download}
        <div class="download-note">CLICK TO DOWNLOAD</div>
      </article>`;
  }).join("");

  window.scrollTo(0, 0);
}

function openDownload(link) {
  if (!validLink(link)) {
    alert("Please add a valid download link.");
    return;
  }
  window.open(link, "_blank", "noopener,noreferrer");
}

function searchMods(value) {
  currentSearch = value;

  if (currentPage === "home") {
    renderModCards(modsData, document.getElementById("allMods"));
    return;
  }

  if (currentPage === "category") {
    renderModCards(
      modsData.filter(mod => mod.category === currentCategory),
      document.getElementById("categoryMods")
    );
    return;
  }

  if (currentPage === "versions" && currentMod) {
    const query = value.trim().toLowerCase();

    const matches = currentMod.versions
      .map((version, index) => ({ version, index }))
      .filter(({ version }) =>
        (currentMod.name + " " + version.version + " " +
          version.liveries.map(item => item.name).join(" "))
          .toLowerCase().includes(query)
      );

    app.innerHTML = `
      <button class="back"
        onclick="openCategory('${escapeHTML(currentMod.category)}')">
        ← BACK
      </button>
      <h2 class="section-title">${escapeHTML(currentMod.name)}</h2>
      <div class="grid">
        ${matches.map(({ version, index }) => `
          <div class="card">
            <h3>${escapeHTML(version.version)}</h3>
            <button class="primary"
              onclick="openVersion('${escapeHTML(currentMod.id)}', ${index})">
              DOWNLOAD MOD
            </button>
          </div>
        `).join("")}
      </div>`;

    if (!matches.length) {
      app.innerHTML += `<div class="empty">No matching mods found.</div>`;
    }
    return;
  }

  if (currentPage === "details" && currentMod && currentVersion) {
    openVersion(
      currentMod.id,
      currentMod.versions.indexOf(currentVersion)
    );
  }
}

renderHome();

const params = new URLSearchParams(window.location.search);
const requestedMod = params.get("mod");

if (requestedMod) {
  const found = modsData.find(mod => mod.id === requestedMod);
  if (found) openMod(found.id);
}
</script>
