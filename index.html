<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<meta name="description" content="RS Gaming Mod — BUSSID and BUSSIN mods, versions, videos and downloads.">
<title>RS Gaming Mod</title>
<style>
:root{--bg:#080b14;--panel:#111827;--panel2:#151f32;--text:#f4f7ff;--muted:#aab6ca;--line:#26344b;--accent:#00e5ff;--pink:#ff3cac;--green:#50fa7b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top,#18223a 0,#080b14 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
a{color:inherit}.wrap{width:min(1120px,92%);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}.brand{font-weight:950;letter-spacing:.5px;font-size:clamp(1.2rem,4vw,1.8rem);text-decoration:none;background:linear-gradient(90deg,#ff3cac,#784bff,#00e5ff,#50fa7b,#ffce45,#ff3cac);background-size:300% 300%;color:transparent;background-clip:text;-webkit-background-clip:text;animation:rainbow 7s ease infinite}@keyframes rainbow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.navlink{color:var(--muted);text-decoration:none;font-weight:700}.hero{text-align:center;padding:42px 12px 28px}.hero h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05;margin:0 0 15px;font-weight:1000;background:linear-gradient(90deg,#ff3cac,#00e5ff,#50fa7b,#ffce45);background-size:250%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:rainbow 6s ease infinite}.hero p{color:var(--muted);font-size:clamp(1rem,2.8vw,1.15rem);margin:0 auto;max-width:720px}.searchbox{margin:25px auto 8px;max-width:650px;display:flex;gap:10px}.searchbox input{min-width:0;flex:1;padding:15px 17px;border-radius:14px;border:1px solid var(--line);background:#0c1321;color:white;font-size:1rem;outline:none}.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #00e5ff22}.section-title{font-size:1.5rem;margin:28px 0 15px}.platform-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.platform{background:linear-gradient(145deg,#17243a,#101725);border:1px solid var(--line);border-radius:22px;padding:22px;min-width:0;box-shadow:0 12px 35px #0003}.platform-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}.platform-head img{width:66px;height:66px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);background:#fff}.platform h2{margin:0;font-size:1.45rem}.platform small{color:var(--muted)}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.category{display:flex;align-items:center;justify-content:center;text-align:center;min-height:84px;padding:14px 10px;border:1px solid #34445f;border-radius:15px;background:linear-gradient(140deg,#1c2940,#111a2a);color:#fff;font-weight:850;cursor:pointer;transition:transform .2s,border-color .2s,background .2s;line-height:1.25}.category:hover,.category:focus-visible{transform:translateY(-3px);border-color:var(--accent);background:#1a3043;outline:none}.category .emoji{display:block;font-size:1.35rem;margin-bottom:5px}.panel{margin:24px 0 38px;padding:22px;background:#0e1523;border:1px solid var(--line);border-radius:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel h2{margin:0 0 6px}.muted{color:var(--muted)}.back{border:1px solid #40516e;background:#18243a;color:white;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.version-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:18px}.version{border:1px solid #34445f;background:#152138;color:white;padding:18px 12px;border-radius:14px;font-weight:900;cursor:pointer}.version:hover{border-color:var(--green);color:var(--green)}.detail{text-align:center}.detail h2{font-size:clamp(1.6rem,5vw,2.6rem);overflow-wrap:anywhere;margin:16px 0}.detail .mod-meta{color:var(--muted);margin-bottom:18px}.video{width:100%;max-width:800px;aspect-ratio:16/9;border:0;border-radius:15px;background:#000}.download{display:inline-block;margin:22px auto 8px;background:linear-gradient(90deg,#00d084,#00b9ff);color:#06111b;font-size:1.1rem;font-weight:1000;text-decoration:none;padding:16px 30px;border-radius:13px;box-shadow:0 8px 25px #00d08425}.download:hover{filter:brightness(1.08);transform:translateY(-1px)}.download-note{font-size:.88rem;color:var(--muted);margin-top:6px}.empty{color:var(--muted);padding:18px 0}.footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);text-align:center;font-size:.9rem}.hidden{display:none!important}.toast{margin:12px 0;color:#ffd166;font-size:.9rem}
@media(max-width:700px){.platform-grid{grid-template-columns:1fr}.platform{padding:17px}.hero{padding-top:30px}.topbar{padding:14px 0}.category{min-height:78px}.panel{padding:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar">
<a href="#" class="brand" id="homeBrand">RS Gaming Mod</a>
<a class="navlink" href="#games">BUSSID &amp; BUSSIN</a>
</header>

<main>
<section class="hero" id="home">
<h1>RS Gaming Mod</h1>
<p>BUSSID &amp; BUSSIN Mods — Easy And Fast Download</p>
<div class="searchbox">
<input id="search" type="search" placeholder="Search mods or categories..." aria-label="Search mods or categories">
</div>
</section>

<section id="games">
<h2 class="section-title">Choose Your Game</h2>
<div class="platform-grid" id="platformGrid"></div>
</section>

<section id="results" class="panel hidden" aria-live="polite">
<div class="panel-head">
<div><h2 id="resultTitle">Mods</h2><div class="muted" id="resultSubtitle"></div></div>
<button class="back" id="backButton" type="button">← Home</button>
</div>
<div id="resultBody"></div>
</section>
</main>

<footer class="footer">© <span id="year"></span> RS Gaming Mod · Download files only from sources you trust.</footer>
</div>

<script>
/*
  ADD A MOD:
  Add a new object to MODS below. The website makes an internal ID automatically
  and does not display that ID publicly.
  GitHub Pages is static hosting: editing this data in the repository publishes
  the new mod after the GitHub Pages build/update. No admin panel or Google Sheets.
*/
const PROFILES = {
  BUSSID: "https://raw.githubusercontent.com/Rsgamingmod/RsGamingMod-/main/unnamed%20(2).png",
  BUSSIN: "https://raw.githubusercontent.com/Rsgamingmod/RsGamingMod-/main/unnamed%20(1).png"
};

const CATEGORIES = [
  {name:"REALISTIC RAIN 🌧️⛈️ MOD", icon:"🌧️"},
  {name:"STEERING WHEEL MOD", icon:"🛞"},
  {name:"WHEEL CAP MOD", icon:"⚙️"},
  {name:"GARAGE MOD", icon:"🏠"}
];

/* Example mod supplied by the site owner. Replace/add entries as you upload mods. */
const MODS = [
  {
    game:"BUSSID",
    category:"STEERING WHEEL MOD",
    version:"V4.6",
    name:"ASHOK LEYLAND STEERING WHEEL PACK",
    video:"https://youtu.be/eZfmXlZqSEU",
    download:"https://sharemods.com/8yf6gh81ry69/ASHOK_LEYLAND_STEERING_WHEEL_PACK.7z.html",
    published:"2026-10-26"
  }
];

const $ = (s) => document.querySelector(s);
const platformGrid = $("#platformGrid");
const results = $("#results");
const resultTitle = $("#resultTitle");
const resultSubtitle = $("#resultSubtitle");
const resultBody = $("#resultBody");
const search = $("#search");
let currentView = {type:"home"};

/* Deterministic internal IDs; never displayed on public pages. */
function makeInternalId(mod){
  const source=[mod.game,mod.category,mod.version,mod.name].join("|").toLowerCase();
  let hash=2166136261;
  for(let i=0;i<source.length;i++){hash^=source.charCodeAt(i);hash=Math.imul(hash,16777619);}
  return "rs-"+(hash>>>0).toString(36);
}
const normalizedMods = MODS.map(mod=>({...mod, internalId:makeInternalId(mod)}));

function safeYouTubeEmbed(url){
  try{
    const u = new URL(url);
    let id = "";
    if(u.hostname === "youtu.be") id = u.pathname.slice(1);
    else if(["youtube.com","www.youtube.com","m.youtube.com"].includes(u.hostname)) {
      if(u.pathname === "/watch") id = u.searchParams.get("v") || "";
      else if(u.pathname.startsWith("/embed/")) id = u.pathname.split("/")[2] || "";
      else if(u.pathname.startsWith("/shorts/")) id = u.pathname.split("/")[2] || "";
    }
    if(!/^[A-Za-z0-9_-]{11}$/.test(id)) return "";
    return "https://www.youtube-nocookie.com/embed/" + id;
  }catch{return "";}
}
function safeDownload(url){
  try{
    const u = new URL(url);
    if(u.protocol !== "https:") return "";
    return u.href;
  }catch{return "";}
}
function makeButton(text,fn,cls="category"){
  const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=text;b.addEventListener("click",fn);return b;
}
function showHome(){
  currentView={type:"home"};
  results.classList.add("hidden");
  $("#games").classList.remove("hidden");
  $("#home").classList.remove("hidden");
  search.value="";
  renderPlatforms();
  window.scrollTo({top:0,behavior:"smooth"});
}
function openCategory(game,category){
  currentView={type:"category",game,category};
  $("#games").classList.add("hidden");$("#home").classList.add("hidden");
  results.classList.remove("hidden");
  resultTitle.textContent=category;
  resultSubtitle.textContent=game+" · Choose a version";
  resultBody.replaceChildren();
  const list=normalizedMods.filter(m=>m.game===game&&m.category===category);
  const versions=[...new Set(list.map(m=>m.version))];
  if(!versions.length){
    const p=document.createElement("p");p.className="empty";p.textContent="No versions uploaded yet. New mods will appear here when added to the website data.";resultBody.append(p);
  }else{
    const grid=document.createElement("div");grid.className="version-grid";
    versions.forEach(v=>grid.append(makeButton(v,()=>openVersion(game,category,v),"version")));
    resultBody.append(grid);
  }
  window.scrollTo({top:results.offsetTop-10,behavior:"smooth"});
}
function openVersion(game,category,version){
  currentView={type:"version",game,category,version};
  const mod=normalizedMods.find(m=>m.game===game&&m.category===category&&m.version===version);
  results.classList.remove("hidden");$("#games").classList.add("hidden");$("#home").classList.add("hidden");
  resultTitle.textContent=version+" · "+category;
  resultSubtitle.textContent=game+" · Mod details";
  resultBody.replaceChildren();
  if(!mod){const p=document.createElement("p");p.className="empty";p.textContent="This version could not be found.";resultBody.append(p);return;}
  const box=document.createElement("article");box.className="detail";
  const h=document.createElement("h2");h.textContent=mod.name;box.append(h);
  const meta=document.createElement("div");meta.className="mod-meta";meta.textContent=game+"  •  "+category+"  •  "+version;box.append(meta);
  const embed=safeYouTubeEmbed(mod.video||"");
  if(embed){
    const iframe=document.createElement("iframe");iframe.className="video";iframe.src=embed;iframe.title=mod.name+" video";iframe.loading="lazy";iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";iframe.referrerPolicy="strict-origin-when-cross-origin";iframe.allowFullscreen=true;box.append(iframe);
  }else{
    const p=document.createElement("p");p.className="empty";p.textContent="Video not added for this mod yet.";box.append(p);
  }
  const href=safeDownload(mod.download||"");
  if(href){
    const a=document.createElement("a");a.className="download";a.href=href;a.target="_blank";a.rel="noopener noreferrer";a.textContent="⬇ DOWNLOAD MOD";box.append(a);
    const note=document.createElement("div");note.className="download-note";note.textContent="Click Download to open the file host. Follow that host's download instructions.";box.append(note);
  }else{
    const p=document.createElement("p");p.className="empty";p.textContent="Download link not added yet.";box.append(p);
  }
  resultBody.append(box);
  window.scrollTo({top:results.offsetTop-10,behavior:"smooth"});
}
function renderPlatforms(filter=""){
  platformGrid.replaceChildren();
  const q=filter.trim().toLowerCase();
  ["BUSSID","BUSSIN"].forEach(game=>{
    const gameMods=normalizedMods.filter(m=>m.game===game);
    const matches=gameMods.filter(m=>[m.name,m.category,m.version,game].join(" ").toLowerCase().includes(q));
    const card=document.createElement("section");card.className="platform";
    const head=document.createElement("div");head.className="platform-head";
    const img=document.createElement("img");img.src=PROFILES[game];img.alt=game+" profile";img.loading="lazy";img.referrerPolicy="no-referrer";
    img.onerror=()=>{img.style.display="none";};
    const titles=document.createElement("div");const h=document.createElement("h2");h.textContent=game;const small=document.createElement("small");small.textContent=game==="BUSSID"?"Bus Simulator Indonesia Mods":"BUSSIN Mods";
    titles.append(h,small);head.append(img,titles);card.append(head);
    const grid=document.createElement("div");grid.className="category-grid";
    CATEGORIES.forEach(cat=>{
      const matching=matches.filter(m=>m.category===cat.name);
      if(q && !matching.length && !(cat.name.toLowerCase().includes(q))) return;
      const b=makeButton("",()=>openCategory(game,cat.name));
      const icon=document.createElement("span");icon.className="emoji";icon.textContent=cat.icon;
      const label=document.createElement("span");label.textContent=cat.name;
      b.append(icon,label);
      grid.append(b);
    });
    if(q){
      matches.filter(m=>!CATEGORIES.some(c=>c.name===m.category)).forEach(m=>{
        const b=makeButton(`${m.category} · ${m.version}`,()=>openCategory(game,m.category));grid.append(b);
      });
    }
    if(!grid.children.length){const p=document.createElement("p");p.className="empty";p.textContent="No matching category or mod found.";card.append(p);}
    else card.append(grid);
    platformGrid.append(card);
  });
}
$("#backButton").addEventListener("click",()=>{
  if(currentView.type==="version") openCategory(currentView.game,currentView.category);
  else showHome();
});
$("#homeBrand").addEventListener("click",e=>{e.preventDefault();showHome();});
search.addEventListener("input",()=>renderPlatforms(search.value));
$("#year").textContent=new Date().getFullYear();
renderPlatforms();
</script>
</body>
  </html>
