
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>RS Gaming Mod | BUSSID & BUSSIN</title>
<meta name="description" content="RS Gaming Mod - Discover BUSSID and BUSSIN mods, versions, videos and downloads.">
<style>
:root {
  --bg:#080b16;
  --panel:#12182b;
  --border:#29334d;
  --text:#f5f7ff;
  --muted:#aab4cf;
  --accent:#00e5ff;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
header{
  padding:24px 14px 20px;text-align:center;
  background:radial-gradient(ellipse at top,#18304e,#080b16 75%);
  border-bottom:1px solid var(--border);
}
.logo{
  margin:0;font-size:clamp(30px,8vw,48px);
  font-weight:1000;letter-spacing:2px;
  background:linear-gradient(90deg,#ff315a,#ffd740,#00f0ff,#b66aff,#ff315a);
  background-size:300% auto;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:rainbow 7s linear infinite;
}
@keyframes rainbow{
  to{background-position:300% center}
}
.tagline{color:#dce6ff;font-size:14px;margin-top:10px}
.wrap{max-width:1000px;margin:auto;padding:16px}
.search{
  width:100%;padding:15px 17px;border-radius:14px;
  border:1px solid #354461;background:#11182a;
  color:white;outline:none;margin:8px 0 20px;
}
.search:focus{border-color:var(--accent)}
.section-title{
  font-size:21px;font-weight:900;margin:20px 0 13px;
}
.games{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.game{
  min-width:0;background:linear-gradient(145deg,#182440,#101524);
  border:1px solid var(--border);border-radius:17px;
  padding:14px 8px;text-align:center;
}
.game img{
  width:100%;height:110px;object-fit:contain;
  border-radius:10px;margin-bottom:8px;
}
.game h2{font-size:20px;margin:5px 0;color:#fff}
.game p{font-size:12px;color:var(--muted);margin:5px 0}
.category-grid,.version-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}
.category,.version{
  text-align:left;color:white;width:100%;min-width:0;
  border:1px solid #36425e;border-radius:13px;padding:15px 11px;
  background:linear-gradient(130deg,#222c48,#12182a);
  overflow-wrap:anywhere;transition:.2s;
}
.category:hover,.version:hover{
  border-color:#00e5ff;transform:translateY(-2px);
}
.cat-name{font-size:13px;font-weight:900;line-height:1.5}
.cat-sub{display:block;color:#aab4cf;font-size:11px;margin-top:7px}
.card{
  background:var(--panel);border:1px solid var(--border);
  padding:17px;border-radius:16px;margin:13px 0;
}
.back{
  border:1px solid #43506c;background:#172039;
  color:white;border-radius:10px;padding:10px 14px;
  margin:5px 0 15px;
}
.page-title{font-size:23px;overflow-wrap:anywhere;margin:10px 0}
.mod-name{
  font-size:clamp(25px,7vw,40px);font-weight:1000;
  text-align:center;overflow-wrap:anywhere;
  color:#fff;margin:24px 0;
}
.video{
  width:100%;aspect-ratio:16/9;background:#05070d;
  border:1px solid var(--border);border-radius:12px;
}
.download-wrap{text-align:center;margin:24px 0}
.download{
  display:inline-block;background:linear-gradient(90deg,#00c853,#00e5a8);
  color:#04170e;text-decoration:none;font-weight:900;
  padding:15px 35px;border-radius:12px;
  border:0;width:min(100%,300px);
}
.download-note{font-size:12px;color:var(--muted);margin-top:10px}
.muted{color:var(--muted);line-height:1.6}
.hidden{display:none!important}
.empty{padding:25px 10px;text-align:center;color:var(--muted)}
footer{
  border-top:1px solid var(--border);text-align:center;
  padding:22px 12px;color:var(--muted);font-size:12px;margin-top:30px;
}
@media(min-width:650px){
 .wrap{padding:24px}
 .game img{height:160px}
 .category-grid,.version-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>

<header>
  <h1 class="logo">RS GAMING MOD</h1>
  <div class="tagline">BUSSID &amp; BUSSIN Mods — Easy And Fast Download</div>
</header>

<main class="wrap">
  <input id="search" class="search" type="search"
    placeholder="🔍 Search mod, category or version..."
    aria-label="Search mods">

  <section id="home">
    <h2 class="section-title">🎮 CHOOSE YOUR GAME</h2>
    <div class="games">
      <button class="game" onclick="openGame('BUSSID')">
        <img
          src="https://raw.githubusercontent.com/Rsgamingmod/RsGamingMod-/main/unnamed%20(2).png"
          alt="BUSSID profile"
          onerror="this.style.display='none'">
        <h2>BUSSID</h2>
        <p>Explore all BUSSID categories</p>
      </button>
      <button class="game" onclick="openGame('BUSSIN')">
        <img
          src="https://raw.githubusercontent.com/Rsgamingmod/RsGamingMod-/main/unnamed%20(1).png"
          alt="BUSSIN profile"
          onerror="this.style.display='none'">
        <h2>BUSSIN</h2>
        <p>Explore all BUSSIN categories</p>
      </button>
    </div>

    <h2 class="section-title">🔥 ALL CATEGORIES</h2>
    <div id="allCategories" class="category-grid"></div>
  </section>

  <section id="categoryPage" class="hidden">
    <button class="back" onclick="goHome()">← Home</button>
    <h2 id="categoryTitle" class="page-title"></h2>
    <p class="muted">Select a version to explore available mods.</p>
    <div id="versions" class="version-grid"></div>
  </section>

  <section id="versionPage" class="hidden">
    <button class="back" onclick="backToCategory()">← Versions</button>
    <h2 id="versionTitle" class="page-title"></h2>
    <div id="modsList"></div>
  </section>

  <section id="detailPage" class="hidden">
    <button class="back" onclick="backToVersion()">← Mods</button>
    <div class="card">
      <p id="detailInfo" class="muted"></p>
      <h1 id="detailName" class="mod-name"></h1>
      <div id="videoArea"></div>
      <div class="download-wrap">
        <a id="downloadButton" class="download"
          href="#" target="_blank" rel="noopener noreferrer">
          ⬇ DOWNLOAD MOD
        </a>
        <div class="download-note">Click on Download to get your mod.</div>
      </div>
    </div>
  </section>

  <p id="status" class="muted" aria-live="polite">Loading mods...</p>
</main>

<footer>
  © <span id="year"></span> RS Gaming Mod · BUSSID &amp; BUSSIN
</footer>

<script>
"use strict";

const CATEGORIES = [
  "REALISTIC RAIN 🌧️⛈️ MOD",
  "STEERING WHEEL MOD",
  "WHEEL CAP MOD",
  "GARAGE MOD"
];

// Sample data lets the site work before mods.json is created.
// Replace these examples with your own real mod details.
const SAMPLE_MODS = [
  {
    game:"BUSSID",
    category:"REALISTIC RAIN 🌧️⛈️ MOD",
    version:"v4.6",
    name:"Realistic Rain Mod Demo",
    video:"",
    download:"https://github.com/Rsgamingmod/RsGamingMod-"
  },
  {
    game:"BUSSID",
    category:"STEERING WHEEL MOD",
    version:"v4.5.2",
    name:"Steering Wheel Mod Demo",
    video:"",
    download:"https://github.com/Rsgamingmod/RsGamingMod-"
  },
  {
    game:"BUSSIN",
    category:"WHEEL CAP MOD",
    version:"v4.6",
    name:"Wheel Cap Mod Demo",
    video:"",
    download:"https://github.com/Rsgamingmod/RsGamingMod-"
  },
  {
    game:"BUSSIN",
    category:"GARAGE MOD",
    version:"v4.5.2",
    name:"Garage Mod Demo",
    video:"",
    download:"https://github.com/Rsgamingmod/RsGamingMod-"
  }
];

let mods = [];
let selectedGame = "";
let selectedCategory = "";
let selectedVersion = "";
let currentMod = null;

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[char]);
}

// Generate an internal ID from the mod name.
// The ID is not displayed on public pages.
function makeModId(mod) {
  const slug = String(mod.name || "mod")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "")
    .slice(0,70) || "mod";

  return slug + "-" + String(mod.game || "").toLowerCase()
    + "-" + String(mod.version || "").toLowerCase();
}

function normalizeMods(data) {
  if (!Array.isArray(data)) return [];
  return data.filter(m =>
    m && ["BUSSID","BUSSIN"].includes(String(m.game || "").toUpperCase())
    && typeof m.name === "string" && m.name.trim()
    && typeof m.category === "string" && m.category.trim()
    && typeof m.version === "string" && m.version.trim()
    && typeof m.download === "string"
    && /^https:\/\/(github\.com|raw\.githubusercontent\.com|drive\.google\.com|www\.mediafire\.com|mediafire\.com)\//i.test(m.download)
  ).map(m => ({
    ...m,
    game:String(m.game).toUpperCase(),
    id:makeModId(m)
  }));
}

async function loadMods() {
  try {
    const response = await fetch("./mods.json", {cache:"no-store"});
    if (!response.ok) throw new Error("mods.json not found");
    const data = await response.json();
    mods = normalizeMods(data);
    $("status").textContent = "Mods loaded: " + mods.length;
  } catch (error) {
    mods = normalizeMods(SAMPLE_MODS);
    $("status").textContent =
      "Demo mods loaded. Add mods.json to GitHub to publish your mods.";
  }
  renderCategories();
}

function showPage(id) {
  ["home","categoryPage","versionPage","detailPage"].forEach(page => {
    $(page).classList.toggle("hidden", page !== id);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function goHome() {
  selectedGame = "";
  selectedCategory = "";
  selectedVersion = "";
  showPage("home");
  renderCategories();
}

function openGame(game) {
  selectedGame = game;
  selectedCategory = "";
  const filtered = mods.filter(m => m.game === game);
  renderCategoryButtons(filtered, $("allCategories"));
  $("home").querySelector(".section-title").textContent =
    "🎮 " + game + " CATEGORIES";
  showPage("home");
}

function renderCategoryButtons(list, container) {
  container.innerHTML = "";
  const categories = [...new Set(list.map(m => m.category))];

  if (!categories.length) {
    container.innerHTML =
      '<div class="empty">No categories found yet.</div>';
    return;
  }

  categories.forEach(category => {
    const count = list.filter(m => m.category === category).length;
    const button = document.createElement("button");
    button.className = "category";
    button.innerHTML =
      '<span class="cat-name">' + escapeHTML(category) + '</span>' +
      '<span class="cat-sub">' + count + ' mods · View versions →</span>';
    button.addEventListener("click", () => openCategory(category));
    container.appendChild(button);
  });
}

function renderCategories() {
  const list = selectedGame
    ? mods.filter(m => m.game === selectedGame)
    : mods;
  renderCategoryButtons(list, $("allCategories"));
}

function openCategory(category) {
  selectedCategory = category;
  $("categoryTitle").textContent =
    (selectedGame ? selectedGame + " · " : "") + category;
  const list = mods.filter(m =>
    m.category === category &&
    (!selectedGame || m.game === selectedGame)
  );
  const versions = [...new Set(list.map(m => m.version))];
  $("versions").innerHTML = "";

  if (!versions.length) {
    $("versions").innerHTML =
      '<div class="empty">No versions available.</div>';
  }

  versions.forEach(version => {
    const count = list.filter(m => m.version === version).length;
    const button = document.createElement("button");
    button.className = "version";
    button.innerHTML =
      '<strong>' + escapeHTML(version) + '</strong>' +
      '<span class="cat-sub">' + count + ' mods · View mods →</span>';
    button.addEventListener("click", () => openVersion(version));
    $("versions").appendChild(button);
  });

  showPage("categoryPage");
}

function backToCategory() {
  openCategory(selectedCategory);
}

function openVersion(version) {
  selectedVersion = version;
  $("versionTitle").textContent = version + " · Available Mods";
  const list = mods.filter(m =>
    m.category === selectedCategory &&
    m.version === version &&
    (!selectedGame || m.game === selectedGame)
  );
  $("modsList").innerHTML = "";

  if (!list.length) {
    $("modsList").innerHTML =
      '<div class="empty">No mods available for this version.</div>';
  }

  list.forEach(mod => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<h3>' + escapeHTML(mod.name) + '</h3>' +
      '<p class="muted">' + escapeHTML(mod.game) +
      ' · ' + escapeHTML(mod.category) +
      ' · ' + escapeHTML(mod.version) + '</p>' +
      '<button class="download" type="button">VIEW MOD →</button>';
    card.querySelector("button").addEventListener("click", () => {
      openMod(mod);
    });
    $("modsList").appendChild(card);
  });

  showPage("versionPage");
}

function backToVersion() {
  openVersion(selectedVersion);
}

function openMod(mod) {
  currentMod = mod;
  $("detailName").textContent = mod.name;
  $("detailInfo").textContent =
    mod.game + " · " + mod.category + " · " + mod.version;

  const video = String(mod.video || "").trim();
  const area = $("videoArea");
  area.innerHTML = "";

  if (video) {
    let videoId = "";
    try {
      const url = new URL(video);
      if (url.hostname === "youtu.be") {
        videoId = url.pathname.slice(1);
      } else if (url.hostname.endsWith("youtube.com")) {
        videoId = url.searchParams.get("v") ||
          url.pathname.split("/").filter(Boolean).pop() || "";
      }
    } catch (_) {}

    if (/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
      const iframe = document.createElement("iframe");
      iframe.className = "video";
      iframe.title = "Mod video";
      iframe.src = "https://www.youtube-nocookie.com/embed/" + videoId;
      iframe.loading = "lazy";
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      area.appendChild(iframe);
    } else {
      const link = document.createElement("a");
      link.href = video;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "▶ Watch mod video";
      area.appendChild(link);
    }
  } else {
    area.innerHTML = '<p class="muted">Mod video coming soon.</p>';
  }

  $("downloadButton").href = mod.download;
  showPage("detailPage");
}

$("search").addEventListener("input", function() {
  const query = this.value.trim().toLowerCase();

  if (!query) {
    if (!$("home").classList.contains("hidden")) renderCategories();
    return;
  }

  const results = mods.filter(m =>
    [m.game,m.category,m.version,m.name]
      .some(v => String(v).toLowerCase().includes(query))
  );

  $("home").querySelector(".section-title").textContent =
    "🔎 SEARCH RESULTS";
  renderCategoryButtons(results, $("allCategories"));

  // Show direct matching mods as well as their categories.
  const container = $("allCategories");
  results.forEach(mod => {
    const button = document.createElement("button");
    button.className = "category";
    button.innerHTML =
      '<span class="cat-name">' + escapeHTML(mod.name) + '</span>' +
      '<span class="cat-sub">' + escapeHTML(mod.game) + ' · ' +
      escapeHTML(mod.version) + ' · Open mod →</span>';
    button.addEventListener("click", () => openMod(mod));
    container.appendChild(button);
  });

  showPage("home");
});

$("year").textContent = new Date().getFullYear();
loadMods();
</script>
</body>
</html>
