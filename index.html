<style>
:root {
  --bg: #07111f;
  --card: #101e30;
  --red: #ff304f;
  --green: #21db8b;
  --text: #ffffff;
  --muted: #b8c5d6;
  --border: #26364b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 24px 12px;
  background: linear-gradient(135deg, #101e30, #172b46);
  border-bottom: 2px solid var(--red);
}

.logo {
  font-size: clamp(27px, 6vw, 43px);
  font-weight: 900;
  margin: 0;
  background: linear-gradient(90deg, #ff304f, #ffb52e, #21db8b, #31baff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

header p {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 0;
}

nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 13px;
  background: #0b1727;
  border-bottom: 1px solid var(--border);
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 8px;
  padding: 12px 17px;
  font-weight: bold;
}

.nav-button {
  background: #192a40;
  color: white;
}

.nav-button:hover { background: var(--red); }

main {
  width: min(1000px, 94%);
  margin: 24px auto;
  min-height: 55vh;
}

.hero {
  text-align: center;
  padding: 22px 10px;
}

.hero h2 {
  font-size: clamp(22px, 5vw, 34px);
}

.hero h2 span { color: var(--green); }

.hero p { color: var(--muted); }

.search-wrap {
  max-width: 650px;
  margin: 22px auto;
}

#search {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #344862;
  background: #101e30;
  color: white;
  font-size: 16px;
  outline: none;
}

#search:focus { border-color: var(--green); }

.section-title {
  font-size: 22px;
  border-left: 4px solid var(--red);
  padding-left: 12px;
  margin: 28px 0 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  min-width: 0;
}

.card h3 { overflow-wrap: anywhere; }

.card p {
  color: var(--muted);
  font-size: 14px;
}

.category-card {
  text-align: center;
  padding: 28px 10px;
  cursor: pointer;
}

.category-card:hover { border-color: var(--green); }

.category-icon { font-size: 35px; }

.primary {
  background: var(--green);
  color: #061b13;
  display: block;
  width: 100%;
  margin-top: 13px;
  font-size: 15px;
}

.back {
  background: #213750;
  color: white;
  margin-bottom: 18px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 30px 8px;
}

.policy {
  line-height: 1.8;
  color: var(--muted);
}

/* MOD DOWNLOAD PAGE */

.download-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 20px;
  padding: 24px 0 36px;
}

.mod-heading {
  width: 100%;
  text-align: center;
  font-size: clamp(25px, 6vw, 40px);
  font-weight: 900;
  line-height: 1.3;
  overflow-wrap: anywhere;
  margin: 0;
  color: #ffffff;
}

.video-box {
  width: 100%;
  max-width: 800px;
}

.video-frame {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: 10px;
  background: #030914;
}

.video-placeholder {
  width: 100%;
  aspect-ratio: 16 / 9;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #101e30;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--muted);
}

.download-wrap {
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.download-button {
  width: 100%;
  padding: 18px 16px;
  font-size: 20px;
  font-weight: 900;
  border-radius: 10px;
  background: var(--green);
  color: #061b13;
}

.download-button:hover { background: #44f2a8; }

.download-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

footer {
  text-align: center;
  padding: 24px 12px;
  margin-top: 40px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
}

footer strong { color: var(--red); }

@media (max-width: 520px) {
  main { width: 92%; }
  .grid { gap: 10px; }
  .card { padding: 11px; }
  .category-card { padding: 22px 5px; }
  .category-card h3,
  .card h3 { font-size: 15px; }
  .download-page { gap: 18px; }
}
</style>

const app = document.getElementById("app");
const searchInput = document.getElementById("search");

let currentPage = "home";
let currentMod = null;
let currentVersion = null;
let currentCategory = "";
let currentSearch = "";

document.getElementById("year").textContent =
  new Date().getFullYear();

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function validLink(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" ||
           url.protocol === "http:";
  } catch {
    return false;
  }
}

function getYouTubeEmbed(link) {
  if (!link || !validLink(link)) return "";

  try {
    const url = new URL(link);
    let id = "";

    if (url.hostname.includes("youtu.be")) {
      id = url.pathname.slice(1);
    } else if (
      url.hostname.includes("youtube.com") ||
      url.hostname.includes("youtube-nocookie.com")
    ) {
      if (url.pathname === "/watch") {
        id = url.searchParams.get("v") || "";
      } else if (
        url.pathname.startsWith("/embed/") ||
        url.pathname.startsWith("/shorts/")
      ) {
        id = url.pathname.split("/")[2] || "";
      }
    }

    if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return "";

    return "https://www.youtube-nocookie.com/embed/" + id;
  } catch {
    return "";
  }
}

function goHome() {
  currentPage = "home";
  currentMod = null;
  currentVersion = null;
  currentCategory = "";
  currentSearch = "";

  renderHome();

function showCategories() {

function showPolicy() {

  app.innerHTML = `

    </div>

}

function renderHome() {
  currentPage = "home";

  app.innerHTML = `
    <h2 class="section-title">CATEGORIES</h2>

    <div class="grid">
      <div class="card category-card"
           onclick="openCategory('BUSSID')">
        <div class="category-icon">🚌</div>
        <h3>BUSSID</h3>
        <button class="primary">VIEW MODS</button>
      </div>

      <div class="card category-card"
           onclick="openCategory('BUSSIN')">
        <div class="category-icon">🚍</div>
        <h3>BUSSIN</h3>
        <button class="primary">VIEW MODS</button>
      </div>
    </div>

    <h2 class="section-title">ALL MODS</h2>
    <div id="allMods" class="grid"></div>
  `;

  renderModCards(
    modsData,
    document.getElementById("allMods")
  );
}

function renderModCards(mods, container) {
  if (!container) return;

  const query = currentSearch.trim().toLowerCase();

  const filtered = mods.filter(mod =>
    (
      mod.name + " " +
      mod.category + " " +
      mod.versions.map(v => v.version).join(" ")
    ).toLowerCase().includes(query)
  );

  if (!filtered.length) {
    container.innerHTML =
      `<div class="empty">No mods found.</div>`;
    return;
  }

  container.innerHTML = filtered.map(mod => `
    <div class="card">
      <div class="category-icon">
        ${escapeHTML(mod.icon || "🚌")}
      </div>

      <p>${escapeHTML(mod.category)}</p>
      <h3>${escapeHTML(mod.name)}</h3>

      <button class="primary"
        onclick="openMod('${escapeHTML(mod.id)}')">
        VIEW VERSIONS
      </button>
    </div>
  `).join("");
}

function openCategory(category) {
  currentPage = "category";
  currentCategory = category;

  app.innerHTML = `
    <button class="back" onclick="goHome()">← HOME</button>

    <h2 class="section-title">
      ${escapeHTML(category)} MODS
    </h2>

    <div id="categoryMods" class="grid"></div>
  `;

  renderModCards(
    modsData.filter(mod => mod.category === category),
    document.getElementById("categoryMods")
  );

  window.scrollTo(0, 0);
}

function openMod(modId) {
  const mod = modsData.find(item => item.id === modId);
  if (!mod) return;

  currentPage = "versions";
  currentMod = mod;
  currentVersion = null;

  app.innerHTML = `
    <button class="back"
      onclick="openCategory('${escapeHTML(mod.category)}')">
      ← BACK
    </button>

    <h2 class="section-title">
      ${escapeHTML(mod.name)}
    </h2>

    <div class="grid">
      ${mod.versions.map((version, index) => `
        <div class="card">
          <h3>${escapeHTML(version.version)}</h3>

          <button class="primary"
            onclick="openVersion('${escapeHTML(mod.id)}', ${index})">
            DOWNLOAD MOD
          </button>
        </div>
      `).join("")}
    </div>
  `;

  window.scrollTo(0, 0);
}

function openVersion(modId, versionIndex) {
  const mod = modsData.find(item => item.id === modId);

  if (!mod || !mod.versions[versionIndex]) return;

  currentPage = "details";
  currentMod = mod;
  currentVersion = mod.versions[versionIndex];

  app.innerHTML = `
    <button class="back"
      onclick="openMod('${escapeHTML(mod.id)}')">
      ← BACK
    </button>

    <div id="downloadList"></div>
  `;

  const list = document.getElementById("downloadList");

  list.innerHTML = currentVersion.liveries.map(item => {
    const embed = getYouTubeEmbed(item.video);

    const videoHTML = embed
      ? `
        <iframe
          class="video-frame"
          src="${escapeHTML(embed)}"
          title="${escapeHTML(item.name)}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      `
      : `
        <div class="video-placeholder">
          VIDEO NOT ADDED
        </div>
      `;

    const downloadHTML = validLink(item.download)
      ? `
        <button class="download-button"
          onclick="openDownload('${escapeHTML(item.download)}')">
          DOWNLOAD
        </button>
      `
      : `
        <button class="download-button" disabled>
          DOWNLOAD
        </button>
      `;

    return `
      <div class="download-page">
        <h1 class="mod-heading">
          ${escapeHTML(item.name)}
        </h1>

        <div class="video-box">
          ${videoHTML}
        </div>

        <div class="download-wrap">
          ${downloadHTML}
        </div>
      </div>
    `;
  }).join("");
}

function openDownload(link) {
  if (!validLink(link)) return;

  window.open(
    link,
    "_blank",
    "noopener,noreferrer"
  );
}

function searchMods(value) {
  currentSearch = value;

  if (currentPage === "home") {
    renderModCards(
      modsData,
      document.getElementById("allMods")
    );
  } else if (currentPage === "category") {
    renderModCards(
      modsData.filter(mod =>
        mod.category === currentCategory
      ),
      document.getElementById("categoryMods")
    );
  } else if (currentPage === "versions" && currentMod) {
    const query = value.trim().toLowerCase();

    const matches = (
      currentMod.name + " " +
      currentMod.versions.map(v => v.version).join(" ")
    ).toLowerCase().includes(query);

    if (query && !matches) {
      app.innerHTML =
        `<div class="empty">No mods found.</div>`;
    } else if (!query) {
      openMod(currentMod.id);
    }
  } else if (
    currentPage === "details" &&
    currentMod &&
    !value.trim()
  ) {
    openMod(currentMod.id);
  }
}
