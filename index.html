
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101116">
<title>RS GAMING MOD - Livery Downloads</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px;background:#181921;border-bottom:2px solid #ffd43b}
header h1{margin:0;color:#ffd43b;font-size:30px;font-weight:900;letter-spacing:1px}
header p{font-size:12px;color:#ddd;margin:9px 0 0}
main{max-width:1100px;margin:auto;padding:15px}
.search{margin:18px 0}
.search input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#22232c;color:#fff;font-size:16px}
.section-title{text-align:center;color:#ffd43b;font-size:24px;margin:24px 0 18px}
.category-grid,.livery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.category-card,.livery-card{background:#1b1c24;border:1px solid #30313b;border-radius:10px;overflow:hidden;cursor:pointer}
.category-card img,.livery-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#292a32}
.category-name{text-align:center;font-size:13px;font-weight:900;padding:12px 5px;color:#ffd43b;overflow-wrap:anywhere}
.livery-name{text-align:center;font-size:14px;font-weight:bold;line-height:1.4;padding:12px 8px;color:#fff;overflow-wrap:anywhere}
.back{padding:11px 16px;margin:5px 0 18px;background:#282933;border:1px solid #555;color:white;border-radius:8px;cursor:pointer}
.video-box{background:#1b1c24;padding:12px;border-radius:12px}
.video-box iframe{width:100%;aspect-ratio:16/9;display:block;border:0;border-radius:8px;background:#000}
.watch{text-align:center;color:#ffd43b;font-size:11px;margin:10px 0 18px}
.watch a{color:#ffd43b;text-decoration:none}
.download{display:block;width:100%;padding:15px;text-align:center;border:0;border-radius:8px;background:linear-gradient(90deg,#ffd43b,#ff9e25);color:#111;font-weight:900;font-size:16px;text-decoration:none}
.download-caption{text-align:center;color:#ccc;font-size:10px;margin:9px 0 2px}
.detail-title{text-align:center;font-size:22px;color:#ffd43b;line-height:1.4;margin:15px 0}
.empty{text-align:center;color:#bbb;padding:25px}
footer{text-align:center;padding:24px 10px;color:#999;font-size:11px;border-top:1px solid #30313b;margin-top:25px}
[hidden]{display:none!important}
@media(min-width:700px){.category-grid,.livery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:950px){.category-grid,.livery-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>

<body>

<header>
  <h1>RS GAMING MOD</h1>
  <p>All Liveries in One App — Easy &amp; Fast Downloads</p>
</header>

<main>
  <div class="search">
    <input id="search" type="search"
      placeholder="🔎 Search liveries..."
      aria-label="Search liveries">
  </div>

  <section id="category-page">
    <h2 class="section-title">LIVERY CATEGORIES</h2>
    <div id="category-grid" class="category-grid"></div>
  </section>

  <section id="livery-page" hidden>
    <button class="back" id="back-category">← Back to Categories</button>
    <h2 class="section-title" id="category-heading"></h2>
    <div id="livery-grid" class="livery-grid"></div>
    <p id="no-liveries" class="empty" hidden>
      No liveries available in this category yet.
    </p>
  </section>

  <section id="detail-page" hidden>
    <button class="back" id="back-liveries">← Back to Liveries</button>
    <div class="video-box">
      <div id="video-container"></div>

      <p class="watch">
        <a id="watch-link" href="#" target="_blank"
           rel="noopener noreferrer">Watch Full Video</a>
      </p>

      <h2 class="detail-title" id="detail-name"></h2>

      <a id="download-button" class="download"
         href="#" target="_blank" rel="noopener noreferrer">
        DOWNLOAD
      </a>

      <p class="download-caption">Click To Download</p>
    </div>
  </section>
</main>

<footer>
  RS GAMING MOD · BUSSID LIVERIES · Easy &amp; Fast Downloads
</footer>

<script>
const photoURL =
"https://raw.githubusercontent.com/Rsgamingmod/RsGamingMod-/8723bc2c8bca058902c9f9d7c1c3f1138cf8ddcb/2026-10-20_15-49-14.jpg";

const categories = [
  {id:"green", name:"NWKRTC GREEN LIVERIES", image:photoURL},
  {id:"ksrtc", name:"KSRTC LIVERIES", image:photoURL},
  {id:"kkrtc", name:"KKRTC LIVERIES", image:photoURL},
  {id:"red-silver", name:"NWKRTC RED & SILVER", image:photoURL},
  {id:"others", name:"OTHER LIVERIES", image:photoURL}
];

const liveries = [
  {
    id:"bussin-1",
    category:"ksrtc",
    name:"BUSSIN 1 LIVERY",
    image:photoURL,
    youtubeId:"ERKcdOQJpvs",
    sharemods:"https://sharemods.com/t6e8nqa5adrq/Ksrtc_Bussin_1_Livery.png.html",
    keywords:"bussin 1 ksrtc bus livery"
  }
];

const categoryPage=document.getElementById("category-page");
const liveryPage=document.getElementById("livery-page");
const detailPage=document.getElementById("detail-page");
const categoryGrid=document.getElementById("category-grid");
const liveryGrid=document.getElementById("livery-grid");
const categoryHeading=document.getElementById("category-heading");
const search=document.getElementById("search");

let activeCategory=null;

function makeImage(url,name){
  const img=document.createElement("img");
  img.src=url;
  img.alt=name;
  img.loading="lazy";
  img.onerror=()=>{
    img.removeAttribute("src");
    img.alt="Image unavailable";
  };
  return img;
}

function renderCategories(){
  categoryGrid.replaceChildren();
  const query=search.value.trim().toLowerCase();

  const results=categories.filter(c=>
    c.name.toLowerCase().includes(query) ||
    liveries.some(l=>l.category===c.id &&
      (l.name+" "+l.keywords).toLowerCase().includes(query))
  );

  results.forEach(c=>{
    const card=document.createElement("article");
    card.className="category-card";
    card.appendChild(makeImage(c.image,c.name));

    const name=document.createElement("div");
    name.className="category-name";
    name.textContent=c.name;
    card.appendChild(name);

    card.addEventListener("click",()=>openCategory(c.id));
    categoryGrid.appendChild(card);
  });

  if(results.length===0){
    const msg=document.createElement("p");
    msg.className="empty";
    msg.textContent="No categories or liveries found.";
    categoryGrid.appendChild(msg);
  }
}

function openCategory(id){
  activeCategory=id;
  search.value="";
  categoryPage.hidden=true;
  detailPage.hidden=true;
  liveryPage.hidden=false;
  categoryHeading.textContent=categories.find(c=>c.id===id).name;
  renderLiveries();
  window.scrollTo(0,0);
}

function renderLiveries(){
  liveryGrid.replaceChildren();
  const query=search.value.trim().toLowerCase();

  const results=liveries.filter(l=>
    l.category===activeCategory &&
    (l.name+" "+l.keywords).toLowerCase().includes(query)
  );

  results.forEach(l=>{
    const card=document.createElement("article");
    card.className="livery-card";
    card.appendChild(makeImage(l.image,l.name));

    const name=document.createElement("div");
    name.className="livery-name";
    name.textContent=l.name;
    card.appendChild(name);

    card.addEventListener("click",()=>openLivery(l.id));
    liveryGrid.appendChild(card);
  });

  document.getElementById("no-liveries").hidden=results.length>0;
}

function validVideo(id){
  return /^[A-Za-z0-9_-]{11}$/.test(id||"");
}

function openLivery(id){
  const item=liveries.find(l=>l.id===id);
  if(!item)return;

  categoryPage.hidden=true;
  liveryPage.hidden=true;
  detailPage.hidden=false;

  document.getElementById("detail-name").textContent=item.name;

  const container=document.getElementById("video-container");
  container.replaceChildren();

  const watch=document.getElementById("watch-link");
  const download=document.getElementById("download-button");

  if(validVideo(item.youtubeId)){
    const frame=document.createElement("iframe");
    frame.src="https://www.youtube-nocookie.com/embed/"+
      encodeURIComponent(item.youtubeId);
    frame.title=item.name+" Release Video";
    frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    frame.allowFullscreen=true;
    frame.loading="lazy";
    container.appendChild(frame);

    watch.href="https://youtu.be/"+item.youtubeId;
  }else{
    const msg=document.createElement("p");
    msg.className="empty";
    msg.textContent="YouTube video is not available.";
    container.appendChild(msg);
    watch.href="#";
  }

  download.href=item.sharemods;
  download.onclick=function(event){
    if(!item.sharemods.startsWith("https://sharemods.com/")){
      event.preventDefault();
      alert("Please add the correct ShareMods link.");
    }
  };

  history.pushState({livery:id},"","?livery="+encodeURIComponent(id));
  window.scrollTo(0,0);
}

document.getElementById("back-category").addEventListener("click",()=>{
  history.pushState({},"",window.location.pathname);
  activeCategory=null;
  liveryPage.hidden=true;
  detailPage.hidden=true;
  categoryPage.hidden=false;
  search.value="";
  renderCategories();
  window.scrollTo(0,0);
});

document.getElementById("back-liveries").addEventListener("click",()=>{
  history.pushState({},"",window.location.pathname);
  detailPage.hidden=true;
  liveryPage.hidden=false;
  renderLiveries();
  window.scrollTo(0,0);
});

search.addEventListener("input",()=>{
  if(!categoryPage.hidden){
    renderCategories();
  }else if(!liveryPage.hidden){
    renderLiveries();
  }
});

window.addEventListener("popstate",()=>{
  detailPage.hidden=true;
  liveryPage.hidden=true;
  categoryPage.hidden=false;
  renderCategories();
});

function init(){
  renderCategories();

  const params=new URLSearchParams(window.location.search);
  const id=params.get("livery");
  const item=liveries.find(l=>l.id===id);

  if(item){
    activeCategory=item.category;
    openLivery(item.id);
  }
}

init();
</script>

</body>
</html>
