
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101116">
<title>RS GAMING MOD - Livery Downloads</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px;background:#181921;border-bottom:2px solid #ffd43b}
header h1{margin:0;color:#ffd43b;font-size:30px;font-weight:900;letter-spacing:1px}
header p{font-size:12px;color:#ddd;margin:9px 0 0}
main{max-width:1100px;margin:auto;padding:15px}
.search{margin:18px 0}
.search input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#22232c;color:#fff;font-size:16px}
.section-title{text-align:center;color:#ffd43b;font-size:24px;margin:24px 0 18px}
.category-grid,.livery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.category-card,.livery-card{background:#1b1c24;border:1px solid #30313b;border-radius:10px;overflow:hidden;cursor:pointer}
.category-card img,.livery-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#292a32}
.category-name{text-align:center;font-size:13px;font-weight:900;padding:12px 5px;color:#ffd43b;overflow-wrap:anywhere}
.livery-name{text-align:center;font-size:14px;font-weight:bold;line-height:1.4;padding:12px 8px;overflow-wrap:anywhere}
.back{padding:11px 16px;margin:5px 0 18px;background:#282933;border:1px solid #555;color:white;border-radius:8px;cursor:pointer}
.video-box{background:#1b1c24;padding:12px;border-radius:12px}
.video-box iframe,.video-box video{width:100%;aspect-ratio:16/9;display:block;border:0;border-radius:8px;background:#000}
.watch{text-align:center;color:#ffd43b;font-size:12px;margin:10px 0 18px}
.watch a{color:#ffd43b;text-decoration:none}
.download{display:block;width:100%;padding:15px;text-align:center;border:0;border-radius:8px;background:linear-gradient(90deg,#ffd43b,#ff9e25);color:#111;font-weight:900;font-size:16px;text-decoration:none}
.download-caption{text-align:center;color:#ccc;font-size:11px;margin:9px 0 2px}
.detail-title{text-align:center;font-size:22px;color:#ffd43b;line-height:1.4;margin:15px 0}
.empty{text-align:center;color:#bbb;padding:25px}
.notice{text-align:center;color:#aaa;font-size:12px}
footer{text-align:center;padding:24px 10px;color:#999;font-size:11px;border-top:1px solid #30313b;margin-top:25px}
[hidden]{display:none!important}
@media(min-width:700px){.category-grid,.livery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:950px){.category-grid,.livery-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>

<body>
<header>
<h1>RS GAMING MOD</h1>
<p>All Liveries in One App — Easy &amp; Fast Downloads</p>
</header>

<main>
<div class="search">
<input id="search" type="search" placeholder="🔎 Search liveries..." aria-label="Search liveries">
</div>

<section id="category-page">
<h2 class="section-title">LIVERY CATEGORIES</h2>
<div id="category-grid" class="category-grid"></div>
</section>

<section id="livery-page" hidden>
<button class="back" id="back-category">← Back to Categories</button>
<h2 class="section-title" id="category-heading"></h2>
<div id="livery-grid" class="livery-grid"></div>
<p id="no-liveries" class="empty" hidden>No liveries available yet.</p>
</section>

<section id="detail-page" hidden>
<button class="back" id="back-liveries">← Back to Liveries</button>
<div class="video-box">
<div id="video-container"></div>
<p class="watch"><a id="watch-link" href="#" target="_blank" rel="noopener noreferrer">Watch Full Video</a></p>
<h2 class="detail-title" id="detail-name"></h2>
<a id="download-button" class="download" href="#" target="_blank" rel="noopener noreferrer">DOWNLOAD</a>
<p class="download-caption">Click To Download</p>
</div>
</section>

<p id="status" class="notice"></p>
</main>

<footer>RS GAMING MOD · BUSSID LIVERIES · Easy &amp; Fast Downloads</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* SUPABASE SETUP:
   Paste your Project URL and Publishable/anon key below.
   NEVER use the service_role or secret key in browser code. */

const SUPABASE_URL = "PASTE_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "PASTE_SUPABASE_PUBLISHABLE_OR_ANON_KEY";

const CATEGORIES = [
 {id:"green",name:"NWKRTC GREEN LIVERIES",image:""},
 {id:"ksrtc",name:"KSRTC LIVERIES",image:""},
 {id:"kkrtc",name:"KKRTC LIVERIES",image:""},
 {id:"red-silver",name:"NWKRTC RED & SILVER",image:""},
 {id:"others",name:"OTHER LIVERIES",image:""}
];

const $ = id => document.getElementById(id);
const configured = SUPABASE_URL.startsWith("https://") &&
 !SUPABASE_URL.includes("PASTE_") &&
 !SUPABASE_KEY.includes("PASTE_");

const db = configured
 ? window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)
 : null;

let liveries = [];
let activeCategory = null;

const categoryPage=$("category-page");
const liveryPage=$("livery-page");
const detailPage=$("detail-page");

function safeHttp(url){
 try{
  const u=new URL(url);
  return u.protocol==="https:" ? u.href : "";
 }catch{return ""}
}

function makeImage(url,name){
 const img=document.createElement("img");
 img.alt=name;
 img.loading="lazy";
 const src=safeHttp(url);
 if(src)img.src=src;
 img.onerror=()=>{
  img.removeAttribute("src");
  img.alt="Photo unavailable";
 };
 return img;
}

function categoryFor(id){
 return CATEGORIES.find(c=>c.id===id);
}

function renderCategories(){
 const grid=$("category-grid");
 grid.replaceChildren();
 const q=$("search").value.trim().toLowerCase();

 const visible=CATEGORIES.filter(c=>
  (c.name+" "+c.id).toLowerCase().includes(q) ||
  liveries.some(l=>
   l.category===c.id &&
   (l.name+" "+(l.keywords||"")).toLowerCase().includes(q)
  )
 );

 visible.forEach(c=>{
  const card=document.createElement("article");
  card.className="category-card";

  const categoryItems=liveries.filter(l=>l.category===c.id);
  const image=categoryItems.find(l=>l.image_url)?.image_url||c.image;
  card.appendChild(makeImage(image,c.name));

  const name=document.createElement("div");
  name.className="category-name";
  name.textContent=c.name;
  card.appendChild(name);

  card.onclick=()=>openCategory(c.id);
  grid.appendChild(card);
 });

 if(!visible.length){
  grid.innerHTML='<p class="empty">No categories or liveries found.</p>';
 }
}

function renderLiveries(){
 const grid=$("livery-grid");
 grid.replaceChildren();
 const q=$("search").value.trim().toLowerCase();

 const rows=liveries.filter(l=>
  l.category===activeCategory &&
  (l.name+" "+(l.keywords||"")).toLowerCase().includes(q)
 );

 rows.forEach(l=>{
  const card=document.createElement("article");
  card.className="livery-card";
  card.appendChild(makeImage(l.image_url,l.name));

  const name=document.createElement("div");
  name.className="livery-name";
  name.textContent=l.name;
  card.appendChild(name);

  card.onclick=()=>openLivery(l.id);
  grid.appendChild(card);
 });

 $("no-liveries").hidden=rows.length>0;
}

function openCategory(id,push=true){
 if(!categoryFor(id))return;

 activeCategory=id;
 categoryPage.hidden=true;
 detailPage.hidden=true;
 liveryPage.hidden=false;
 $("search").value="";
 $("category-heading").textContent=categoryFor(id).name;
 renderLiveries();

 if(push){
  history.pushState({category:id},"","?category="+encodeURIComponent(id));
 }
 window.scrollTo(0,0);
}

function getYoutubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes("youtu.be"))
   return u.pathname.slice(1).split("/")[0];
  if(u.hostname.includes("youtube.com"))
   return u.searchParams.get("v") ||
    u.pathname.split("/").filter(Boolean).pop();
 }catch{}
 return "";
}

function openLivery(id,push=true){
 const l=liveries.find(x=>x.id===id);
 if(!l)return;

 activeCategory=l.category;
 categoryPage.hidden=true;
 liveryPage.hidden=true;
 detailPage.hidden=false;
 $("detail-name").textContent=l.name;

 const box=$("video-container");
 box.replaceChildren();

 const yt=getYoutubeId(l.video_url||"");
 const watch=$("watch-link");

 if(l.video_url&&yt){
  const f=document.createElement("iframe");
  f.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(yt);
  f.title=l.name+" video";
  f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  f.allowFullscreen=true;
  f.loading="lazy";
  box.appendChild(f);
  watch.href=safeHttp(l.video_url)||"#";
  watch.textContent="Watch Full Video";
  watch.hidden=false;
 }else if(l.video_url){
  const v=document.createElement("video");
  v.controls=true;
  v.preload="metadata";
  v.src=safeHttp(l.video_url);
  box.appendChild(v);
  watch.href=v.src;
  watch.textContent="Open Video";
  watch.hidden=!v.src;
 }else{
  watch.hidden=true;
  const p=document.createElement("p");
  p.className="empty";
  p.textContent="Video not added yet.";
  box.appendChild(p);
 }

 const download=safeHttp(l.download_url||"");
 $("download-button").href=download||"#";
 $("download-button").onclick=e=>{
  if(!download){
   e.preventDefault();
   alert("Download link is not available yet.");
  }
 };

 if(push){
  history.pushState({livery:id},"","?livery="+encodeURIComponent(id));
 }
 window.scrollTo(0,0);
}

function showHome(push=true){
 activeCategory=null;
 categoryPage.hidden=false;
 liveryPage.hidden=true;
 detailPage.hidden=true;
 $("search").value="";
 renderCategories();

 if(push)history.pushState({},"",location.pathname);
 window.scrollTo(0,0);
}

async function loadLiveries(){
 if(!db){
  $("status").textContent="Setup required: add your Supabase URL and key in index.html and admin.html.";
  renderCategories();
  return;
 }

 $("status").textContent="Loading liveries…";

 const {data,error}=await db.from("liveries")
  .select("*")
  .eq("published",true)
  .order("created_at",{ascending:false});

 if(error){
  $("status").textContent="Could not load liveries. Check Supabase setup.";
  console.error(error);
  return;
 }

 liveries=data||[];
 $("status").textContent=liveries.length
  ?`${liveries.length} livery/liveries available`
  :"New liveries will appear here soon.";

 renderCategories();

 const p=new URLSearchParams(location.search);
 const id=p.get("livery");
 const cat=p.get("category");

 if(id&&liveries.some(l=>l.id===id))openLivery(id,false);
 else if(cat&&categoryFor(cat))openCategory(cat,false);
}

$("back-category").onclick=()=>showHome();

$("back-liveries").onclick=()=>{
 detailPage.hidden=true;
 categoryPage.hidden=true;
 liveryPage.hidden=false;
 renderLiveries();
 history.pushState({category:activeCategory},"",
  "?category="+encodeURIComponent(activeCategory));
 window.scrollTo(0,0);
};

$("search").addEventListener("input",()=>{
 if(!categoryPage.hidden)renderCategories();
 else if(!liveryPage.hidden)renderLiveries();
});

window.addEventListener("popstate",()=>{
 const p=new URLSearchParams(location.search);
 const id=p.get("livery");
 const cat=p.get("category");

 if(id&&liveries.some(l=>l.id===id))openLivery(id,false);
 else if(cat&&categoryFor(cat))openCategory(cat,false);
 else showHome(false);
});

loadLiveries();
</script>
</body>
</html>
