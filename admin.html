
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS GAMING MOD — Admin</title>
<meta name="theme-color" content="#080d19">
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#f4f7ff;font-family:Arial,sans-serif}
header{padding:22px 14px;text-align:center;background:#0e1728;border-bottom:1px solid #263550}
.logo{font-size:30px;font-weight:900;background:linear-gradient(90deg,#ff304f,#ffbf45,#21db8b,#279cff);background-clip:text;-webkit-background-clip:text;color:transparent}
header p{color:#aab6cc;font-size:12px}
main{max-width:850px;margin:auto;padding:18px 13px}
.panel{background:#111a2b;border:1px solid #293852;border-radius:14px;padding:18px;margin-bottom:18px}
h2{font-size:20px;margin-top:0}
label{display:block;font-size:13px;color:#cbd5e7;margin:13px 0 6px}
input,textarea,select{width:100%;padding:12px;background:#080d19;border:1px solid #34435c;border-radius:8px;color:white;font-size:15px}
textarea{min-height:85px;resize:vertical}
button,.btn{display:inline-block;border:0;border-radius:8px;padding:12px 15px;font-weight:bold;cursor:pointer;text-decoration:none;text-align:center}
.primary{background:#21db8b;color:#06160e}
.secondary{background:#263c5b;color:white}
.danger{background:#ff304f;color:white}
.full{width:100%;margin-top:14px}
.status{padding:11px;border-radius:8px;background:#17243a;color:#cfe3ff;white-space:pre-wrap;font-size:13px;margin:12px 0}
.hidden{display:none!important}
.item{padding:14px 0;border-bottom:1px solid #293852;overflow-wrap:anywhere}
.item:last-child{border-bottom:0}
.item h3{margin:0 0 7px}
.muted{color:#aab6cc;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a{color:#8fc7ff}
@media(max-width:550px){.row{grid-template-columns:1fr}.logo{font-size:25px}}
</style>
</head>
<body>
<header>
  <div class="logo">RS GAMING MOD</div>
  <p>ADMIN PANEL · MANAGE YOUR LIVERIES</p>
  <a href="./" style="font-size:13px">← Open Public Website</a>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>
    <p class="muted">Sign in using the admin username and password created in Supabase.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" placeholder="Enter admin username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
    <button id="loginButton" class="primary full">LOGIN</button>
    <div id="loginStatus" class="status">Enter your admin login details.</div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h2>Add / Edit Livery</h2>
      <div id="formStatus" class="status">Add livery details below.</div>
      <form id="liveryForm">
        <input id="editId" type="hidden">
        <label for="title">Livery Name *</label>
        <input id="title" required maxlength="150" placeholder="Example: BUSSIN 1 LIVERY">

        <label for="category">Category *</label>
        <select id="category" required>
          <option value="NWKRTC GREEN LIVERYS">NWKRTC GREEN LIVERYS</option>
          <option value="KSRTC LIVERYS">KSRTC LIVERYS</option>
          <option value="KKRTC LIVERYS">KKRTC LIVERYS</option>
          <option value="NWKRTC RED & SILVER">NWKRTC RED & SILVER</option>
          <option value="OTHERS LIVERY'S">OTHERS LIVERY'S</option>
        </select>

        <label for="description">Description (optional)</label>
        <textarea id="description" placeholder="Write a short description"></textarea>

        <label for="imageUrl">Image URL (optional)</label>
        <input id="imageUrl" type="url" placeholder="https://...">
        <label for="imageFile">Or upload image</label>
        <input id="imageFile" type="file" accept="image/*">

        <label for="videoUrl">Video URL (YouTube or direct MP4)</label>
        <input id="videoUrl" type="url" placeholder="https://youtu.be/...">
        <label for="videoFile">Or upload a video (max 50 MB)</label>
        <input id="videoFile" type="file" accept="video/mp4,video/webm,video/ogg">

        <label for="downloadUrl">ShareMods Download URL *</label>
        <input id="downloadUrl" type="url" required placeholder="https://sharemods.com/...">

        <label for="published">Publishing status</label>
        <select id="published">
          <option value="true">Published — show on website</option>
          <option value="false">Draft — keep hidden</option>
        </select>

        <button id="saveButton" class="primary full" type="submit">SAVE LIVERY</button>
        <button id="clearButton" class="secondary full" type="button">CLEAR FORM</button>
      </form>
    </div>

    <div class="panel">
      <h2>Existing Liveries</h2>
      <input id="adminSearch" placeholder="Search your liveries...">
      <div id="listStatus" class="status">Loading...</div>
      <div id="liveryList"></div>
    </div>

    <button id="logoutButton" class="danger full">LOG OUT</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://iopmucoezxsrnyunziba.supabase.co";
const SUPABASE_KEY = "sb_publishable_AYTnAVwsIA-6pBx-a9G4-g_JglbD3uK";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "livery-media";

const $ = id => document.getElementById(id);
let currentUser = null;
let liveries = [];

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function validUrl(value) {
  if (!value) return "";
  try {
    const u = new URL(value);
    return ["http:","https:"].includes(u.protocol) ? u.href : "";
  } catch { return ""; }
}
function message(id, text) { $(id).textContent = text; }

async function checkAdmin(user) {
  const {data, error} = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    throw new Error("Could not verify admin permission. Check admin_users table and RLS policies.");
  }
  if (!data) {
    await db.auth.signOut();
    throw new Error("This account is not an authorized admin. Add its user ID to admin_users in Supabase.");
  }
}

async function showDashboard(user) {
  currentUser = user;
  $("loginPanel").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  await loadLiveries();
}

$("loginButton").addEventListener("click", async () => {
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) {
    message("loginStatus", "Enter both username and password.");
    return;
  }

  message("loginStatus", "Signing in...");
  $("loginButton").disabled = true;
  try {
    const email = username.includes("@") ? username : username + "@admin.rsgamingmod.com";
    const {data, error} = await db.auth.signInWithPassword({email, password});
    if (error) throw error;
    await checkAdmin(data.user);
    await showDashboard(data.user);
  } catch (err) {
    message("loginStatus", "Login failed: " + (err.message || "Please check your details."));
  } finally {
    $("loginButton").disabled = false;
  }
});

async function loadLiveries() {
  message("listStatus", "Loading liveries...");
  const {data, error} = await db
    .from("liveries")
    .select("*")
    .order("created_at", {ascending:false});

  if (error) {
    message("listStatus", "Could not load liveries: " + error.message);
    return;
  }
  liveries = data || [];
  renderList();
}

function renderList() {
  const term = $("adminSearch").value.trim().toLowerCase();
  const items = liveries.filter(x =>
    `${x.title || ""} ${x.category || ""}`.toLowerCase().includes(term)
  );
  $("liveryList").innerHTML = "";

  if (!items.length) {
    message("listStatus", "No liveries found. Add your first livery above.");
    return;
  }
  message("listStatus", items.length + " livery/liveries found.");

  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <h3>${escapeHtml(item.title)}</h3>
      <div class="muted">${escapeHtml(item.category)} · ${item.published ? "PUBLISHED" : "DRAFT"}</div>
      <div class="actions">
        <button class="secondary edit">EDIT</button>
        <button class="danger delete">DELETE</button>
      </div>`;
    div.querySelector(".edit").addEventListener("click", () => editLivery(item));
    div.querySelector(".delete").addEventListener("click", () => deleteLivery(item));
    $("liveryList").appendChild(div);
  });
}

function editLivery(item) {
  $("editId").value = item.id;
  $("title").value = item.title || "";
  $("category").value = item.category || "OTHERS LIVERY'S";
  $("description").value = item.description || "";
  $("imageUrl").value = item.image_url || "";
  $("videoUrl").value = item.video_url || "";
  $("downloadUrl").value = item.download_url || "";
  $("published").value = String(!!item.published);
  $("imageFile").value = "";
  $("videoFile").value = "";
  message("formStatus", "Editing: " + item.title + ". Save to update.");
  window.scrollTo({top:0,behavior:"smooth"});
}

async function uploadFile(file, kind) {
  if (!file) return null;
  const max = kind === "video" ? 50 * 1024 * 1024 : 10 * 1024 * 1024;
  if (file.size > max) throw new Error(kind + " file is too large. Maximum size: " + (kind === "video" ? "50 MB" : "10 MB") + ".");
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = currentUser.id + "/" + Date.now() + "-" + safeName;
  const {error} = await db.storage.from(BUCKET).upload(path, file, {
    upsert:false,
    contentType:file.type || undefined
  });
  if (error) throw error;
  const {data} = db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

$("liveryForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser) {
    message("formStatus", "Please log in again.");
    return;
  }

  const title = $("title").value.trim();
  const category = $("category").value;
  const downloadUrl = validUrl($("downloadUrl").value.trim());
  if (!title || !downloadUrl) {
    message("formStatus", "Enter the livery name and a valid ShareMods download URL.");
    return;
  }

  $("saveButton").disabled = true;
  message("formStatus", "Saving... Please wait.");

  try {
    let imageUrl = validUrl($("imageUrl").value.trim());
    let videoUrl = validUrl($("videoUrl").value.trim());

    const uploadedImage = await uploadFile($("imageFile").files[0], "image");
    const uploadedVideo = await uploadFile($("videoFile").files[0], "video");
    if (uploadedImage) imageUrl = uploadedImage;
    if (uploadedVideo) videoUrl = uploadedVideo;

    const record = {
      title,
      category,
      description: $("description").value.trim(),
      image_url: imageUrl || null,
      video_url: videoUrl || null,
      download_url: downloadUrl,
      published: $("published").value === "true"
    };

    const editId = $("editId").value;
    let result;
    if (editId) {
      result = await db.from("liveries").update(record).eq("id", editId);
    } else {
      result = await db.from("liveries").insert(record);
    }
    if (result.error) throw result.error;

    message("formStatus", "Saved successfully!");
    $("liveryForm").reset();
    $("editId").value = "";
    await loadLiveries();
  } catch (err) {
    message("formStatus", "Could not save: " + (err.message || "Unknown error"));
  } finally {
    $("saveButton").disabled = false;
  }
});

$("clearButton").addEventListener("click", () => {
  $("liveryForm").reset();
  $("editId").value = "";
  message("formStatus", "Form cleared.");
});

async function deleteLivery(item) {
  if (!confirm('Delete "' + item.title + '"? This cannot be undone.')) return;
  const {error} = await db.from("liveries").delete().eq("id", item.id);
  if (error) {
    message("listStatus", "Delete failed: " + error.message);
    return;
  }
  await loadLiveries();
}

$("adminSearch").addEventListener("input", renderList);

$("logoutButton").addEventListener("click", async () => {
  await db.auth.signOut();
  currentUser = null;
  $("dashboard").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
  message("loginStatus", "You have logged out.");
});

(async function restoreSession() {
  const {data} = await db.auth.getSession();
  if (data.session?.user) {
    try {
      await checkAdmin(data.session.user);
      await showDashboard(data.session.user);
    } catch (err) {
      message("loginStatus", err.message);
    }
  }
})();
</script>
</body>
</html>
